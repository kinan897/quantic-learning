# English Foundations (Grade 8 English, ENL1W, ENG2D) — Writing strong paragraphs

id: english-foundations-u1
title: Writing Strong Paragraphs
description: >-
  The building block of every essay: a clear point, solid evidence, real explanation and a
  link back to the argument.

lessons:
  - id: english-foundations-u1-t1-learn
    kind: learn
    topic: The PEEL Paragraph
    title: 'Learn: The PEEL Paragraph'
    description: Point, Evidence, Explain, Link.
    xp: 10
    items:
      - type: teach
        id: peel-structure
        title: One paragraph, one idea
        blocks:
          - type: text
            md: |-
              A strong body paragraph proves **one** main idea. The **PEEL** structure keeps it
              focused:

              | | Part | What it does |
              |---|---|---|
              | **P** | Point | States the paragraph's main idea (the topic sentence) |
              | **E** | Evidence | Gives a quote, fact or example that supports it |
              | **E** | Explain | Shows *how* the evidence proves the point |
              | **L** | Link | Connects back to the thesis or leads into the next idea |

      - id: what-p-means
        type: multiple_choice
        prompt: In a PEEL paragraph, what does the **P** stand for?
        choices: [Proof, Point, Paraphrase, Purpose]
        answer: 1
        explanation: The Point is the topic sentence, the claim the rest of the paragraph supports.

      - type: teach
        id: topic-sentences
        title: Strong topic sentences
        blocks:
          - type: text
            md: |-
              A topic sentence makes a **specific claim** that someone could argue with. It's
              not just a fact or a topic.

              - Weak: *"This paragraph is about school uniforms."* (announces a topic)
              - Weak: *"Many schools have uniforms."* (a fact, nothing to prove)
              - Strong: *"School uniforms reduce pressure on students to compete over clothing."*
          - type: callout
            tone: key
            md: Ask yourself, "Could someone disagree?" If not, the claim isn't specific enough yet.

      - id: strongest-topic-sentence
        type: multiple_choice
        prompt: Which is the strongest topic sentence?
        choices:
          - In this paragraph I will talk about homework.
          - Homework is work students do at home.
          - Short daily homework helps students remember what they learned in class.
          - Some students have homework.
        answer: 2
        explanation: It makes a specific, arguable claim that the rest of the paragraph can prove.

      - type: teach
        id: explain-not-summarize
        title: Explain, don't just summarize
        blocks:
          - type: text
            md: |-
              Evidence alone doesn't prove anything. The **Explain** step shows the reader *how*
              it supports your point.

              - Evidence: *"After the school introduced uniforms, reports of clothing-related
                bullying fell by half."*
              - Weak explanation: *"This shows that bullying went down."* (repeats the evidence)
              - Strong explanation: *"Because everyone looked the same, clothing was no longer
                a way to single students out, which removed one common reason for bullying."*
          - type: callout
            tone: tip
            md: 'Useful starters: "This shows that...", "Because of this...", "This matters because..."'

      - id: which-explains
        type: multiple_choice
        prompt: Which sentence **explains** evidence instead of just repeating it?
        choices:
          - The study found that students slept less.
          - The study had many students in it.
          - Less sleep means students have less energy to focus, which explains the lower test scores.
          - Students slept less, according to the study.
        answer: 2
        explanation: It connects the evidence (less sleep) to the point (lower scores) and explains *why*.

  - id: english-foundations-u1-t1-practice
    kind: practice
    topic: The PEEL Paragraph
    title: 'Practice: The PEEL Paragraph'
    description: Spot each part of a paragraph.
    xp: 10
    items:
      - id: identify-evidence
        type: multiple_choice
        prompt: |-
          *(1) Recess helps students learn. (2) A study of Grade 5 classes found that students
          focused longer after 20 minutes of outdoor play. (3) Moving around refreshes the brain,
          so students return ready to concentrate. (4) For this reason, schools should protect
          recess time.*

          Which sentence is the **Evidence**?
        choices: [Sentence 1, Sentence 2, Sentence 3, Sentence 4]
        answer: 1
        explanation: Sentence 2 gives a specific fact (the study) that supports the point.

      - id: identify-explain
        type: multiple_choice
        prompt: In the same recess paragraph, which sentence **Explains** the evidence?
        choices: [Sentence 1, Sentence 2, Sentence 3, Sentence 4]
        answer: 2
        explanation: Sentence 3 explains *why* play improves focus. It links the evidence to the point.

      - id: identify-link
        type: multiple_choice
        prompt: In the same paragraph, which sentence is the **Link**?
        choices: [Sentence 1, Sentence 2, Sentence 3, Sentence 4]
        answer: 3
        explanation: Sentence 4 ties the paragraph back to the bigger argument about protecting recess.

      - id: does-not-belong
        type: multiple_choice
        prompt: |-
          *(1) Reading every day builds vocabulary. (2) Readers meet new words in context, which
          helps them remember meanings. (3) My favourite colour is blue. (4) Over time, stronger
          vocabulary makes writing clearer.*

          Which sentence does **not** belong?
        choices: [Sentence 1, Sentence 2, Sentence 3, Sentence 4]
        answer: 2
        explanation: Sentence 3 has nothing to do with the point about reading and vocabulary.

      - id: transition-contrast
        type: multiple_choice
        prompt: Which transition word shows **contrast**?
        choices: [Furthermore, However, For example, As a result]
        answer: 1
        explanation: '"However" signals that the next idea goes against or limits the previous one.'

      - id: fact-or-claim
        type: multiple_choice
        prompt: Which sentence is an arguable claim, not just a fact?
        choices:
          - Ottawa is the capital of Canada.
          - Water boils at 100 °C at sea level.
          - Cities should add more bike lanes to reduce traffic.
          - The school day starts at 8:30.
        answer: 2
        explanation: People could reasonably disagree about bike lanes. The others are simply facts.

  - id: english-foundations-u1-t1-destroyer
    kind: destroyer
    topic: The PEEL Paragraph
    title: 'Destroyer: The PEEL Paragraph'
    description: Fix weak paragraphs and spot faulty reasoning.
    xp: 30
    items:
      - id: missing-part
        type: multiple_choice
        prompt: |-
          *Video games can improve problem-solving. In a 2020 survey, players who played strategy
          games scored higher on puzzle tests. Video games can improve problem-solving.*

          What is this paragraph missing?
        choices:
          - a Point
          - Evidence
          - an Explanation of how the evidence proves the point
          - a transition word
        answer: 2
        explanation: >-
          It has a point and evidence, then just repeats the point. It never explains *why*
          strategy games would build problem-solving skills.

      - id: weak-reasoning
        type: multiple_choice
        prompt: |-
          *"My cousin ate breakfast every day and got straight A's, so eating breakfast causes good
          grades."*

          What is the main problem with this reasoning?
        choices:
          - It uses a transition word incorrectly
          - It draws a big conclusion from a single example
          - It has no topic sentence
          - Breakfast is not a real topic
        answer: 1
        explanation: One person's experience can't prove a cause. Other reasons could explain the grades.

      - id: best-link
        type: multiple_choice
        prompt: >-
          An essay argues that schools should start later. A paragraph shows that teenagers'
          sleep cycles shift later in the evening. Which is the best **Link** sentence?
        choices:
          - Teenagers like sleeping.
          - Some schools start at 8:00.
          - Because teenagers' bodies are wired to fall asleep later, a later start would let them get the sleep they need to learn.
          - In conclusion, sleep is important for everyone.
        answer: 2
        explanation: It connects the paragraph's evidence directly back to the essay's argument about start times.

      - id: revise-vague
        type: multiple_choice
        prompt: 'Which revision of *"Technology is good and bad"* makes the clearest, most arguable point?'
        choices:
          - Technology has many sides.
          - There are good things and bad things about technology.
          - Phones in class distract students more than they help them learn.
          - Technology is very interesting.
        answer: 2
        explanation: It picks one specific, arguable claim instead of a vague statement that can't be proven or disproven.

  # =========================================================================================
  # Topic 2: Introductions and conclusions
  # =========================================================================================
  - id: english-foundations-u1-t2-learn
    kind: learn
    topic: Introductions and Conclusions
    title: 'Learn: Introductions and Conclusions'
    description: Hook the reader, state the thesis, and finish strong.
    xp: 10
    items:
      - type: teach
        id: funnel-introduction
        title: The funnel introduction
        blocks:
          - type: text
            md: |-
              A strong introduction moves from general to specific, like a funnel:

              1. **Hook**: a surprising fact, question or vivid image that makes the reader care.
              2. **Context**: the background the reader needs (the topic, the text, the author).
              3. **Thesis**: your specific, arguable claim, usually the last sentence.
          - type: callout
            tone: warning
            title: Hooks to avoid
            md: 'Dictionary definitions ("Webster''s defines courage as...") and huge claims ("Since the dawn of time...") feel lazy.'

      - id: thesis-location
        type: multiple_choice
        prompt: Where does the thesis usually go in a funnel introduction?
        choices: [The first sentence, The middle, The last sentence, In the conclusion only]
        answer: 2
        explanation: The introduction narrows down to the thesis, so it comes last.

      - type: teach
        id: good-hooks
        title: Hooks that work
        blocks:
          - type: text
            md: |-
              - **Surprising fact**: *"The average teen checks their phone over 100 times a day."*
              - **Question**: *"What would you give up to be popular?"*
              - **Scene**: *"The bell rang, but nobody moved."*
              - **Bold statement**: *"Homework is stealing your sleep."*

              The best hook connects directly to your thesis.

      - id: best-hook
        type: multiple_choice
        prompt: An essay argues that schools should start later. Which hook is best?
        choices:
          - Since the beginning of time, people have slept.
          - Teenagers' body clocks shift later during puberty, yet most high schools start before 8:30.
          - This essay is about school start times.
          - Sleep is defined as a state of rest.
        answer: 1
        explanation: It's a specific, surprising fact that leads straight into the argument.

      - type: teach
        id: strong-conclusions
        title: Strong conclusions
        blocks:
          - type: text
            md: |-
              A conclusion is the funnel flipped: specific to general.

              1. **Restate the thesis in new words** (don't copy it).
              2. **Sum up** the main points briefly.
              3. **Zoom out**: why does this matter beyond the essay?
          - type: callout
            tone: key
            md: Never add brand-new evidence in the conclusion. It's for closing, not opening new arguments.

      - id: conclusion-mistake
        type: multiple_choice
        prompt: Which is a mistake in a conclusion?
        choices:
          - Restating the thesis in new words
          - Briefly summing up the main points
          - Introducing a new quote that wasn't discussed
          - Explaining why the topic matters
        answer: 2
        explanation: New evidence belongs in a body paragraph, where you can explain it.

  - id: english-foundations-u1-t2-practice
    kind: practice
    topic: Introductions and Conclusions
    title: 'Practice: Introductions and Conclusions'
    description: Spot the parts and pick the strongest options.
    xp: 10
    items:
      - id: hook-purpose
        type: multiple_choice
        prompt: What is the main job of a hook?
        choices: [To state the thesis, To grab the reader's interest, To list the evidence, To summarize the essay]
        answer: 1
        explanation: The hook makes the reader want to keep reading.

      - id: identify-context
        type: multiple_choice
        prompt: >-
          "In S. E. Hinton's novel The Outsiders, two rival gangs clash in 1960s Oklahoma."
          Which part of an introduction is this sentence?
        choices: [Hook, Context, Thesis, Conclusion]
        answer: 1
        explanation: It gives background on the text the reader needs before the thesis.

      - id: funnel-order
        type: multiple_choice
        prompt: What is the correct order for a funnel introduction?
        choices: ['Thesis → Hook → Context', 'Context → Thesis → Hook', 'Hook → Context → Thesis', 'Hook → Thesis → Context']
        answer: 2
        explanation: General to specific, ending on the thesis.

      - id: restate-thesis
        type: multiple_choice
        prompt: >-
          Thesis: "Social media harms teens' sleep, focus and self-esteem." Which is the best
          restatement for the conclusion?
        choices:
          - Social media harms teens' sleep, focus and self-esteem.
          - In conclusion, this essay was about social media.
          - Clearly, the constant scroll costs teens far more than time. It drains their rest, attention and confidence.
          - Social media is popular.
        answer: 2
        explanation: Same idea, new words, and it sounds like a confident ending.

      - id: weak-hook
        type: multiple_choice
        prompt: Which hook is weakest?
        choices:
          - '"Are we raising a generation that can''t be bored?"'
          - Since the dawn of time, humans have used technology.
          - Last year, the average Canadian teen spent over seven hours a day on screens.
          - The phone buzzed again, the fourth time in a minute.
        answer: 1
        explanation: It's vague and could start any essay about anything.

      - id: zoom-out
        type: multiple_choice
        prompt: What does it mean to "zoom out" at the end of a conclusion?
        choices:
          - Repeat each body paragraph word for word
          - Show why the argument matters in a bigger context
          - Add a new piece of evidence
          - Apologize for any weak points
        answer: 1
        explanation: Zooming out connects your essay to the wider world or a lasting idea.

  - id: english-foundations-u1-t2-destroyer
    kind: destroyer
    topic: Introductions and Conclusions
    title: 'Destroyer: Introductions and Conclusions'
    description: Judge and repair full introductions and conclusions.
    xp: 30
    items:
      - id: fix-introduction
        type: multiple_choice
        prompt: |-
          What is the biggest problem with this introduction?

          "Friendship is important. In this essay I will talk about friendship in The Outsiders.
          There are many friendships in the book. Ponyboy has friends."
        choices:
          - It has no hook at all
          - It has no arguable thesis; it only announces a topic
          - It is too long
          - It uses the title of the book
        answer: 1
        explanation: Nothing here makes a claim someone could argue with. Every sentence just states facts or the topic.

      - id: order-introduction
        type: multiple_choice
        prompt: |-
          Put these in the strongest order for an introduction:

          A. Hinton shows that loyalty to friends can matter more than loyalty to a gang.
          B. When Johnny tells Ponyboy to "stay gold," he isn't talking about gangs at all.
          C. The Outsiders follows two rival groups, the Greasers and the Socs, in 1960s Oklahoma.
        choices: ['A → B → C', 'C → A → B', 'B → C → A', 'B → A → C']
        answer: 2
        explanation: Hook (B), context (C), thesis (A).

      - id: best-conclusion
        type: multiple_choice
        prompt: >-
          Thesis: "Uniforms help students focus on learning instead of image." Which closing
          sentence zooms out best?
        choices:
          - That is why uniforms are good.
          - In the end, what we wear should never decide how much we learn.
          - Uniforms come in many colours.
          - Another reason is that uniforms are cheaper, which I didn't mention.
        answer: 1
        explanation: It lifts the argument into a broader, memorable idea without adding new evidence.

      - id: thesis-repair
        type: multiple_choice
        prompt: 'Which revision turns "The book has a lot of symbolism." into an arguable thesis?'
        choices:
          - The book has a lot of different symbols.
          - In The Outsiders, the sunset symbolizes that Greasers and Socs share more than divides them.
          - Symbolism is when an object stands for an idea.
          - I will discuss the symbolism in the book.
        answer: 1
        explanation: It names a specific symbol and makes a claim about what it means.
