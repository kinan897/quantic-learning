<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="title">
  <title id="title">f of x goes into a machine that takes the limit of secant slopes, and f prime of x comes out</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .box { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #FFFFFF; font-weight: 700; }
    .note { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; fill: #94A3B8; font-size: 15px; }
  </style>

  <!-- input -->
  <rect x="10" y="60" width="140" height="80" rx="16" fill="#06184C" stroke="#54AFF5" stroke-width="3"/>
  <text x="80" y="110" text-anchor="middle" class="box" font-size="30" font-style="italic">f(x)</text>
  <text x="80" y="170" text-anchor="middle" class="note">a function</text>

  <line x1="158" y1="100" x2="212" y2="100" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- machine -->
  <rect x="220" y="40" width="200" height="120" rx="20" fill="#1A42EF"/>
  <rect x="236" y="56" width="168" height="88" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="320" y="92" text-anchor="middle" class="box" font-size="17">secant slope</text>
  <text x="320" y="120" text-anchor="middle" class="box" font-size="17">as h → 0</text>
  <text x="320" y="190" text-anchor="middle" class="note">first principles</text>

  <line x1="428" y1="100" x2="482" y2="100" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- output -->
  <rect x="490" y="60" width="140" height="80" rx="16" fill="#06184C" stroke="#54AFF5" stroke-width="3"/>
  <text x="560" y="110" text-anchor="middle" class="box" font-size="30" font-style="italic">f′(x)</text>
  <text x="560" y="170" text-anchor="middle" class="note">its slope at every x</text>
</svg>
