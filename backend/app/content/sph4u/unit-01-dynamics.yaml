# SPH4U — Strand B: Dynamics

id: sph4u-u1
title: Dynamics
description: >-
  Forces and motion: net force, Newton's second law, weight, normal force and friction.

lessons:
  - id: sph4u-u1-t1-learn
    kind: learn
    topic: Newton's Second Law
    title: "Learn: Newton's Second Law"
    description: Net force, F = ma, weight and friction.
    xp: 10
    items:
      - type: teach
        id: net-force
        title: Net force and free-body diagrams
        blocks:
          - type: text
            md: >-
              A **free-body diagram** shows every force acting on one object as an arrow. The
              **net force** is the vector sum of all of them. Opposite forces subtract.
          - type: image
            src: science/free-body-box.svg
            alt: >-
              Free-body diagram of a box: 50 N applied to the right, 20 N of friction to the
              left, gravity down and the normal force up.
            aspect: 0.53
          - type: callout
            tone: key
            md: 'Horizontally: $F_{net} = 50 \text{ N} - 20 \text{ N} = 30$ N to the right. Vertically, gravity and the normal force cancel.'

      - id: net-force-check
        type: math_input
        prompt: 'A box has $65$ N pulling right and $25$ N of friction acting left. What is the net force, in newtons?'
        answer: '40'
        placeholder: Enter a number
        explanation: '$65 - 25 = 40$ N to the right.'

      - type: teach
        id: f-equals-ma
        title: Newton's second law
        blocks:
          - type: text
            md: |-
              The net force on an object equals its mass times its acceleration:

              $$\vec{F}_{net} = m\vec{a}$$

              Force is in newtons (N), mass in kilograms (kg), acceleration in m/s². A $30$ N net
              force on a $6$ kg box gives $a = \dfrac{30}{6} = 5$ m/s².
          - type: callout
            tone: tip
            md: 'Same force, more mass → less acceleration. Double the mass and the acceleration halves.'

      - id: acceleration-check
        type: math_input
        prompt: 'A $12$ N net force acts on a $3$ kg cart. What is its acceleration, in m/s²?'
        answer: '4'
        placeholder: Enter a number
        explanation: '$a = \dfrac{F_{net}}{m} = \dfrac{12}{3} = 4$ m/s²'

      - type: teach
        id: weight-and-friction
        title: Weight, normal force and friction
        blocks:
          - type: text
            md: |-
              - **Weight** (force of gravity): $F_g = mg$, with $g = 9.8$ m/s²
              - On a level surface, the **normal force** balances weight: $F_N = mg$
              - **Friction**: $F_f = \mu F_N$, where $\mu$ is the coefficient of friction

              A $10$ kg box with $\mu = 0.30$: $F_f = 0.30 \times 98 = 29.4$ N.

      - id: weight-check
        type: math_input
        prompt: 'What is the weight of a $5.0$ kg object, in newtons? Use $g = 9.8$ m/s².'
        answer: '49'
        tolerance: 0.05
        placeholder: Enter a number
        explanation: '$F_g = mg = 5.0 \times 9.8 = 49$ N'

  - id: sph4u-u1-t1-practice
    kind: practice
    topic: Newton's Second Law
    title: "Practice: Newton's Second Law"
    description: One-step force and acceleration problems.
    xp: 10
    items:
      - id: force-from-acceleration
        type: math_input
        prompt: 'What net force gives a $2.0$ kg cart an acceleration of $3.0$ m/s²?'
        answer: '6'
        tolerance: 0.05
        placeholder: Enter a number
        explanation: '$F = ma = 2.0 \times 3.0 = 6.0$ N'

      - id: acceleration-from-force
        type: math_input
        prompt: 'A $40$ N net force acts on an $8.0$ kg box. What is its acceleration, in m/s²?'
        answer: '5'
        tolerance: 0.05
        placeholder: Enter a number
        explanation: '$a = \dfrac{40}{8.0} = 5.0$ m/s²'

      - id: zero-net-force
        type: multiple_choice
        prompt: If the net force on a moving object is zero, the object...
        choices:
          - slows down and stops
          - keeps moving at a constant velocity
          - speeds up
          - must be at rest
        answer: 1
        explanation: "No net force means no acceleration (Newton's first law): it keeps the same velocity."

      - id: normal-force-flat
        type: math_input
        prompt: 'What is the normal force on a $12$ kg box resting on a level floor, in newtons? Use $g = 9.8$ m/s².'
        answer: '117.6'
        tolerance: 0.1
        placeholder: Enter a number
        explanation: '$F_N = mg = 12 \times 9.8 = 117.6$ N'

      - id: double-the-mass
        type: multiple_choice
        prompt: The same net force pushes an object with twice the mass. Its acceleration...
        choices: [doubles, halves, stays the same, becomes four times larger]
        answer: 1
        explanation: '$a = F/m$: double $m$ with the same $F$ and $a$ is cut in half.'

      - id: friction-force
        type: math_input
        prompt: 'A $20$ kg crate sits on a level floor with $\mu = 0.25$. What is the force of friction, in newtons? Use $g = 9.8$ m/s².'
        answer: '49'
        tolerance: 0.1
        placeholder: Enter a number
        explanation: '$F_f = \mu mg = 0.25 \times 20 \times 9.8 = 49$ N'

  - id: sph4u-u1-t1-destroyer
    kind: destroyer
    topic: Newton's Second Law
    title: "Destroyer: Newton's Second Law"
    description: Friction, two dimensions and elevators.
    xp: 30
    items:
      - id: push-with-friction
        type: math_input
        prompt: >-
          A $15$ kg crate is pushed across a level floor with a $90$ N horizontal force. The
          coefficient of kinetic friction is $0.40$. Find the crate's acceleration, in m/s².
          Use $g = 9.8$ m/s².
        answer: '2.08'
        tolerance: 0.02
        placeholder: Enter a number
        hint: Find friction first, then the net force.
        explanation: |-
          $F_f = 0.40 \times 15 \times 9.8 = 58.8$ N

          $F_{net} = 90 - 58.8 = 31.2$ N, so $a = \dfrac{31.2}{15} = 2.08$ m/s².

      - id: car-acceleration-force
        type: math_input
        prompt: 'A $1200$ kg car speeds up uniformly from rest to $24$ m/s in $8.0$ s. What net force acts on it, in newtons?'
        answer: '3600'
        tolerance: 1
        placeholder: Enter a number
        explanation: '$a = \dfrac{24}{8.0} = 3.0$ m/s², so $F = ma = 1200 \times 3.0 = 3600$ N.'

      - id: perpendicular-forces
        type: math_input
        prompt: 'Forces of $30$ N east and $40$ N north act on a $10$ kg object. What is the size of its acceleration, in m/s²?'
        answer: '5'
        tolerance: 0.05
        placeholder: Enter a number
        hint: Combine perpendicular forces with Pythagoras.
        explanation: '$F_{net} = \sqrt{30^2 + 40^2} = 50$ N, so $a = \dfrac{50}{10} = 5.0$ m/s².'

      - id: elevator-normal-force
        type: math_input
        prompt: >-
          A $70$ kg person stands in an elevator accelerating **upward** at $2.0$ m/s². What normal
          force does the floor exert on them, in newtons? Use $g = 9.8$ m/s².
        answer: '826'
        tolerance: 1
        placeholder: Enter a number
        explanation: |-
          Up is positive: $F_N - mg = ma$, so $F_N = m(g + a) = 70 \times (9.8 + 2.0) = 826$ N.

          The person feels heavier than their usual $686$ N.

  # =========================================================================================
  # Topic 2: Friction and inclines
  # =========================================================================================
  - id: sph4u-u1-t2-learn
    kind: learn
    topic: Friction and Inclines
    title: 'Learn: Friction and Inclines'
    description: Static and kinetic friction, and splitting gravity on a ramp.
    xp: 10
    items:
      - type: teach
        id: friction-force
        title: The friction force
        blocks:
          - type: text
            md: |-
              Friction opposes sliding between surfaces. Its size depends on the **normal force**
              $F_N$ and the **coefficient of friction** $\mu$:

              $$F_f = \mu F_N$$

              - **Static** friction ($\mu_s$) stops an object from starting to move.
              - **Kinetic** friction ($\mu_k$) acts once it slides. Usually $\mu_k < \mu_s$.

              On flat ground with no other vertical forces, $F_N = mg$.
          - type: callout
            tone: tip
            md: That's why it takes more effort to start pushing a heavy box than to keep it moving.

      - id: static-friction-start
        type: math_input
        prompt: 'A $25\ \text{kg}$ crate rests on a level floor with $\mu_s = 0.50$ and $\mu_k = 0.30$. What is the smallest horizontal push, in newtons, that will start it moving? Use $g = 9.8\ \text{m/s}^2$.'
        answer: '122.5'
        tolerance: 0.2
        placeholder: Enter a number
        hint: Starting motion means beating **static** friction.
        explanation: '$F_{s,\max} = \mu_s mg = 0.50 \times 25 \times 9.8 = 122.5\ \text{N}$. Once it slides, only $73.5\ \text{N}$ is needed.'

      - type: teach
        id: incline-components
        title: Gravity on a ramp
        blocks:
          - type: text
            md: |-
              On a ramp at angle $\theta$, split gravity into two parts:

              - **Down the slope**: $mg\sin\theta$
              - **Into the slope**: $mg\cos\theta$, which is balanced by the normal force, so
                $F_N = mg\cos\theta$
          - type: image
            src: science/incline-forces.svg
            alt: >-
              A block on a ramp at angle θ. Gravity mg points straight down and splits into
              mg sin θ down the slope and mg cos θ into the slope. The normal force points out
              of the slope.
            aspect: 0.56

      - id: steeper-ramp
        type: multiple_choice
        prompt: As a ramp gets steeper, what happens to the normal force on a block resting on it?
        choices: [It increases, It decreases, It stays the same, It becomes equal to mg]
        answer: 1
        explanation: '$F_N = mg\cos\theta$, and $\cos\theta$ gets smaller as $\theta$ grows.'

      - type: teach
        id: incline-with-friction
        title: Sliding down with friction
        blocks:
          - type: text
            md: |-
              Along the slope, the net force is gravity's component minus friction:

              $$ma = mg\sin\theta - \mu_k mg\cos\theta \;\Rightarrow\; a = g(\sin\theta - \mu_k\cos\theta)$$

              The mass cancels: on the same ramp, a heavy and a light block slide with the same
              acceleration.

      - id: frictionless-ramp
        type: math_input
        prompt: 'A block slides down a frictionless ramp at $30^\circ$. Using $g = 9.8\ \text{m/s}^2$, what is its acceleration in $\text{m/s}^2$?'
        answer: '4.9'
        tolerance: 0.05
        placeholder: Enter a number
        explanation: '$a = g\sin 30^\circ = 9.8 \times 0.5 = 4.9\ \text{m/s}^2$'

  - id: sph4u-u1-t2-practice
    kind: practice
    topic: Friction and Inclines
    title: 'Practice: Friction and Inclines'
    description: Normal force, friction and ramp components.
    xp: 10
    items:
      - id: friction-direction
        type: multiple_choice
        prompt: A box slides to the right across the floor. Which way does kinetic friction act on it?
        choices: [Right, Left, Up, Down]
        answer: 1
        explanation: Friction opposes the motion.

      - id: normal-on-ramp
        type: math_input
        prompt: 'What is the normal force on a $10\ \text{kg}$ block resting on a $30^\circ$ ramp? Use $g = 9.8\ \text{m/s}^2$ and round to one decimal place.'
        answer: '84.9'
        tolerance: 0.1
        placeholder: newtons
        explanation: '$F_N = mg\cos 30^\circ = 98 \times 0.866 \approx 84.9\ \text{N}$, less than the $98\ \text{N}$ it would be on flat ground.'

      - id: mu-from-forces
        type: math_input
        prompt: 'It takes a $40\ \text{N}$ push to slide a crate at constant speed. The normal force is $200\ \text{N}$. Find $\mu_k$.'
        answer: '0.2'
        tolerance: 0.001
        placeholder: Enter a number
        explanation: 'Constant speed means $F_f = 40\ \text{N}$, so $\mu_k = \dfrac{40}{200} = 0.2$.'

      - id: static-vs-kinetic
        type: multiple_choice
        prompt: For most surfaces, how do the coefficients compare?
        choices: ['μs < μk', 'μs = μk', 'μs > μk', 'They are unrelated']
        answer: 2
        explanation: It usually takes more force to start sliding than to keep sliding.

      - id: component-down-slope
        type: multiple_choice
        prompt: Which expression gives the component of gravity pulling a block down a ramp at angle θ?
        choices: ['mg cos θ', 'mg sin θ', 'mg tan θ', 'mg']
        answer: 1
        explanation: The along-the-slope component is $mg\sin\theta$.

      - id: flat-ramp-limit
        type: multiple_choice
        prompt: What is the normal force on a block on a ramp with θ = 0°?
        choices: ['0', 'mg', 'mg/2', 'It depends on μ']
        answer: 1
        explanation: '$\cos 0^\circ = 1$, so $F_N = mg$, just like flat ground.'

  - id: sph4u-u1-t2-destroyer
    kind: destroyer
    topic: Friction and Inclines
    title: 'Destroyer: Friction and Inclines'
    description: Full free-body problems on ramps.
    xp: 30
    items:
      - id: ramp-with-friction
        type: math_input
        prompt: >-
          A block slides down a $30^\circ$ ramp with $\mu_k = 0.2$. Using $g = 9.8\ \text{m/s}^2$,
          find its acceleration in $\text{m/s}^2$, to two decimal places.
        answer: '3.20'
        tolerance: 0.02
        placeholder: Enter a number
        explanation: '$a = 9.8(\sin 30^\circ - 0.2\cos 30^\circ) = 9.8(0.5 - 0.173) \approx 3.20\ \text{m/s}^2$'

      - id: angle-of-repose
        type: math_input
        prompt: >-
          A block just starts to slip when a ramp is tilted to $25^\circ$. What is $\mu_s$?
          Round to two decimal places.
        answer: '0.47'
        tolerance: 0.01
        placeholder: Enter a number
        hint: 'At the slipping point, $mg\sin\theta = \mu_s mg\cos\theta$.'
        explanation: '$\mu_s = \tan 25^\circ \approx 0.47$'

      - id: pull-up-ramp
        type: math_input
        prompt: >-
          A $5\ \text{kg}$ block is pulled up a frictionless $30^\circ$ ramp by a $40\ \text{N}$
          force parallel to the ramp. Using $g = 9.8\ \text{m/s}^2$, find its acceleration up the
          ramp in $\text{m/s}^2$.
        answer: '3.1'
        tolerance: 0.02
        placeholder: Enter a number
        hint: Gravity's component down the slope works against the pull.
        explanation: '$mg\sin 30^\circ = 5 \times 9.8 \times 0.5 = 24.5\ \text{N}$, so $a = \dfrac{40 - 24.5}{5} = 3.1\ \text{m/s}^2$.'

      - id: mass-cancels
        type: multiple_choice
        prompt: >-
          A 2 kg block and a 10 kg block (same material) slide down the same rough ramp.
          How do their accelerations compare?
        choices:
          - The 10 kg block accelerates 5 times faster
          - The 2 kg block accelerates faster
          - They are the same
          - The 10 kg block doesn't move
        answer: 2
        explanation: '$a = g(\sin\theta - \mu_k\cos\theta)$ doesn''t depend on mass.'
