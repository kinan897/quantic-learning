# ENG4U — Literary analysis and essay writing
# Examples use Shakespeare's Macbeth (public domain).

id: eng4u-u1
title: Literary Analysis
description: >-
  Arguable theses, real analysis instead of plot summary, and quotations that do the work
  for your argument.

lessons:
  - id: eng4u-u1-t1-learn
    kind: learn
    topic: Writing a Strong Thesis
    title: 'Learn: Writing a Strong Thesis'
    description: Thesis statements, analysis vs. summary, and embedding quotations.
    xp: 10
    items:
      - type: teach
        id: what-a-thesis-does
        title: What a thesis does
        blocks:
          - type: text
            md: |-
              A **thesis** is the one-sentence argument your whole essay proves. A strong thesis
              is:

              - **Arguable**: a reasonable reader could disagree
              - **Specific**: it names *what* happens and *why it matters*
              - **Supportable**: you can prove it with evidence from the text

              Weak: *"Macbeth is a play about a man who becomes king."* (plot summary)

              Strong: *"In* Macbeth*, Shakespeare shows that unchecked ambition destroys the
              conscience, as Macbeth's guilt turns into paranoia and violence."*

      - id: pick-the-thesis
        type: multiple_choice
        prompt: Which is an arguable thesis?
        choices:
          - Macbeth was written by William Shakespeare.
          - Macbeth meets three witches in Act 1.
          - Lady Macbeth's collapse shows that guilt cannot be pushed away for long.
          - Macbeth is a tragedy in five acts.
        answer: 2
        explanation: It makes an interpretive claim someone could debate. The others are facts.

      - type: teach
        id: analysis-vs-summary
        title: Analysis, not summary
        blocks:
          - type: text
            md: |-
              **Summary** retells what happens. **Analysis** explains *how* and *why* the
              writer creates meaning.

              - Summary: *"Macbeth kills King Duncan and becomes king."*
              - Analysis: *"Macbeth's hallucination of a bloody dagger before the murder shows
                his mind turning against him even before he acts, foreshadowing the guilt that
                will consume him."*
          - type: callout
            tone: key
            md: 'If a sentence could appear in a plot summary, it isn''t analysis yet. Ask: how does this connect to my thesis?'

      - id: which-is-analysis
        type: multiple_choice
        prompt: Which sentence is **analysis** rather than summary?
        choices:
          - Lady Macbeth sleepwalks in Act 5.
          - Lady Macbeth tries to wash imaginary blood off her hands.
          - The doctor watches Lady Macbeth sleepwalking.
          - Lady Macbeth's obsession with washing her hands shows that her guilt has become impossible to escape.
        answer: 3
        explanation: It interprets the action and explains what it reveals about her guilt.

      - type: teach
        id: embedding-quotations
        title: Embedding quotations
        blocks:
          - type: text
            md: |-
              Don't drop a quotation in on its own. **Introduce** it, **embed** it in your
              sentence, then **explain** it.

              - Dropped: *Lady Macbeth is guilty. "Out, damned spot! Out, I say!"*
              - Embedded: *Lady Macbeth's desperate command, "Out, damned spot!", reveals that
                the guilt she once dismissed now controls her.*
          - type: callout
            tone: tip
            md: Keep quotations short. Quote only the words you are going to analyze.

      - id: best-embedded
        type: multiple_choice
        prompt: Which uses a quotation most effectively?
        choices:
          - '"Fair is foul, and foul is fair." The witches say this.'
          - 'The witches'' paradox, "Fair is foul, and foul is fair," sets up a world where appearances cannot be trusted.'
          - 'This quote is important: "Fair is foul, and foul is fair."'
          - 'The witches talk in Act 1. "Fair is foul, and foul is fair."'
        answer: 1
        explanation: The quotation is woven into the sentence and immediately explained.

  - id: eng4u-u1-t1-practice
    kind: practice
    topic: Writing a Strong Thesis
    title: 'Practice: Writing a Strong Thesis'
    description: Spot strong theses, analysis and well-used evidence.
    xp: 10
    items:
      - id: thesis-too-broad
        type: multiple_choice
        prompt: 'What is the main problem with the thesis *"Macbeth has many themes"*?'
        choices:
          - It is too long
          - It is too broad and doesn't make a specific argument
          - It uses the wrong title
          - It is written in the first person
        answer: 1
        explanation: Every play has many themes. A thesis needs to argue something specific.

      - id: summary-sentence
        type: multiple_choice
        prompt: Which sentence is plot summary?
        choices:
          - Banquo's ghost shows that Macbeth cannot escape what he has done.
          - Macbeth sees Banquo's ghost at the banquet.
          - The ghost's silence makes Macbeth's guilt feel even louder.
          - Shakespeare uses the ghost to make Macbeth's guilt visible to the audience.
        answer: 1
        explanation: It only states what happens, without explaining any meaning.

      - id: explain-quote-step
        type: multiple_choice
        prompt: What should come right after you embed a quotation?
        choices:
          - another quotation
          - a summary of the next scene
          - an explanation of how it supports your point
          - your conclusion
        answer: 2
        explanation: A quotation doesn't speak for itself. The explanation is where your marks come from.

      - id: literary-device
        type: multiple_choice
        prompt: '"Fair is foul, and foul is fair" places opposite ideas side by side. What is this device called?'
        choices: [simile, paradox, onomatopoeia, alliteration only]
        answer: 1
        explanation: A paradox joins contradictory ideas to reveal a deeper truth, here that appearances deceive.

      - id: present-tense
        type: multiple_choice
        prompt: Which sentence follows the convention for writing about literature?
        choices:
          - Macbeth killed Duncan in Act 2.
          - Macbeth will kill Duncan in Act 2.
          - Macbeth kills Duncan in Act 2.
          - Macbeth had killed Duncan in Act 2.
        answer: 2
        explanation: Literary analysis uses the present tense ("the literary present"), because the text always exists now.

      - id: strongest-evidence
        type: multiple_choice
        prompt: 'For the thesis *"Macbeth''s ambition overrides his conscience"*, which evidence fits best?'
        choices:
          - Macbeth is a Scottish nobleman.
          - Macbeth admits he has only "vaulting ambition" to push him toward the murder.
          - The play takes place in Scotland.
          - Duncan has two sons.
        answer: 1
        explanation: It directly shows Macbeth recognizing that ambition is his only motive, which supports the thesis.

  - id: eng4u-u1-t1-destroyer
    kind: destroyer
    topic: Writing a Strong Thesis
    title: 'Destroyer: Writing a Strong Thesis'
    description: Refine arguments and handle counterpoints.
    xp: 30
    items:
      - id: sharpen-thesis
        type: multiple_choice
        prompt: 'Which revision makes *"Lady Macbeth is an important character"* into the strongest thesis?'
        choices:
          - Lady Macbeth is the most important character in Macbeth.
          - Lady Macbeth appears in many scenes of the play.
          - Lady Macbeth's shift from ruthless planner to guilt-ridden sleepwalker shows that conscience cannot be silenced forever.
          - Lady Macbeth is interesting to read about.
        answer: 2
        explanation: It traces a specific change in the character and states what that change reveals.

      - id: counterargument
        type: multiple_choice
        prompt: >-
          Your thesis argues that Macbeth is responsible for his own downfall. Which sentence
          handles a counterargument best?
        choices:
          - Some people disagree, but they are wrong.
          - Although the witches' prophecy plants the idea of kingship, Macbeth alone chooses to murder Duncan.
          - The witches are very creepy.
          - Everyone agrees that Macbeth is guilty.
        answer: 1
        explanation: It admits the strongest opposing point (the witches' influence), then shows why the thesis still holds.

      - id: analyze-the-word
        type: multiple_choice
        prompt: 'Macbeth says his ambition is "vaulting." Which analysis of this word is strongest?'
        choices:
          - '"Vaulting" is an interesting word choice.'
          - '"Vaulting" means jumping.'
          - '"Vaulting" suggests a leap so eager that it overshoots, hinting that Macbeth''s ambition will carry him past his goal into ruin.'
          - Macbeth uses the word "vaulting" in Act 1.
        answer: 2
        explanation: It interprets the word's connotation and links it to where the story is heading.

      - id: paragraph-order
        type: multiple_choice
        prompt: |-
          Put these sentences in the strongest order for a body paragraph:

          A. This hallucination shows that Macbeth's conscience resists the murder even as he plans it.
          B. Shakespeare reveals Macbeth's inner conflict before the murder of Duncan.
          C. Macbeth sees a dagger floating before him, "the handle toward my hand."
          D. His guilt begins before the crime itself, setting up his later collapse.
        choices: ['B → C → A → D', 'C → B → D → A', 'B → A → C → D', 'D → C → A → B']
        answer: 0
        explanation: Point (B), Evidence (C), Explain (A), Link (D). That's the PEEL order.

  # =========================================================================================
  # Topic 2: Literary devices and their effects
  # =========================================================================================
  - id: eng4u-u1-t2-learn
    kind: learn
    topic: Literary Devices
    title: 'Learn: Literary Devices'
    description: Name the device, then explain its effect.
    xp: 10
    items:
      - type: teach
        id: imagery-figurative
        title: Imagery and figurative language
        blocks:
          - type: text
            md: |-
              - **Metaphor**: says one thing *is* another. *"Life's but a walking shadow."*
              - **Simile**: compares using *like* or *as*.
              - **Personification**: gives human qualities to non-human things.
                *"The night has been unruly."*
              - **Imagery**: language that appeals to the senses, like the blood that recurs
                all through Macbeth.
          - type: callout
            tone: key
            md: Naming a device earns nothing on its own. Marks come from explaining **its effect**.

      - id: identify-metaphor
        type: multiple_choice
        prompt: '"Life''s but a walking shadow, a poor player / That struts and frets his hour upon the stage." This is mainly an example of...'
        choices: [Simile, Metaphor, Alliteration, Dramatic irony]
        answer: 1
        explanation: Life is described as a shadow and an actor directly, with no "like" or "as".

      - type: teach
        id: irony
        title: Three kinds of irony
        blocks:
          - type: text
            md: |-
              - **Verbal**: saying the opposite of what you mean.
              - **Situational**: the opposite of what's expected happens.
              - **Dramatic**: the audience knows something a character doesn't.

              When Duncan says Macbeth's castle "hath a pleasant seat," the audience already knows
              the Macbeths plan to murder him there. That's dramatic irony, and it builds dread.

      - id: irony-type
        type: multiple_choice
        prompt: 'Duncan praises Macbeth as "worthy" while the audience knows Macbeth is planning to kill him. What kind of irony is this?'
        choices: [Verbal irony, Situational irony, Dramatic irony, Not irony]
        answer: 2
        explanation: The audience knows the danger; Duncan doesn't.

      - type: teach
        id: device-effect
        title: 'Device → effect → meaning'
        blocks:
          - type: text
            md: |-
              A strong analysis sentence does three things:

              1. **Names** the device and quotes it.
              2. Explains the **effect** on the reader or audience.
              3. Connects it to a **theme** or meaning.

              *"Lady Macbeth's repeated 'Out, damned spot!' uses blood imagery to show that guilt
              cannot be washed away, revealing that conscience outlasts ambition."*
          - type: callout
            tone: tip
            md: Use precise verbs like *suggests*, *evokes*, *foreshadows* and *underscores* instead of *shows*.

      - id: strongest-analysis
        type: multiple_choice
        prompt: 'Which sentence best analyzes the line "Fair is foul, and foul is fair"?'
        choices:
          - This line uses a literary device.
          - The witches say this line in Act 1.
          - The paradox blurs good and evil from the first scene, warning that appearances in the play cannot be trusted.
          - This line rhymes.
        answer: 2
        explanation: It names the device (paradox), explains its effect and connects it to a theme.

  - id: eng4u-u1-t2-practice
    kind: practice
    topic: Literary Devices
    title: 'Practice: Literary Devices'
    description: Identify devices in short passages.
    xp: 10
    items:
      - id: simile-pick
        type: multiple_choice
        prompt: Which line contains a simile?
        choices:
          - The wind howled through the trees.
          - Her voice was as soft as falling snow.
          - Time is a thief.
          - Silver sand slid softly.
        answer: 1
        explanation: It compares using "as."

      - id: alliteration-pick
        type: multiple_choice
        prompt: '"Silver sand slid softly" is an example of...'
        choices: [Alliteration, Onomatopoeia, Hyperbole, Oxymoron]
        answer: 0
        explanation: The repeated "s" sound at the start of words is alliteration.

      - id: personification-pick
        type: multiple_choice
        prompt: Which line uses personification?
        choices:
          - The sky was grey.
          - The old house groaned under the storm.
          - He ran as fast as a cheetah.
          - I've told you a million times.
        answer: 1
        explanation: Houses can't really groan; it gives the house a human sound of suffering.

      - id: hyperbole-pick
        type: multiple_choice
        prompt: '"Will all great Neptune''s ocean wash this blood / Clean from my hand?" Macbeth''s question uses...'
        choices: [Understatement, Simile, Hyperbole, Verbal irony]
        answer: 2
        explanation: Suggesting a whole ocean couldn't clean his hand is a deliberate exaggeration of his guilt.

      - id: foreshadowing-pick
        type: multiple_choice
        prompt: What is foreshadowing?
        choices:
          - A flashback to earlier events
          - A hint about something that will happen later
          - A character speaking alone on stage
          - A comparison using like or as
        answer: 1
        explanation: Foreshadowing builds suspense by hinting at what's to come.

      - id: soliloquy-pick
        type: multiple_choice
        prompt: When a character speaks their thoughts aloud, alone on stage, it's called a...
        choices: [Monologue to the audience, Aside, Soliloquy, Dialogue]
        answer: 2
        explanation: A soliloquy lets the audience hear a character's private thoughts.

  - id: eng4u-u1-t2-destroyer
    kind: destroyer
    topic: Literary Devices
    title: 'Destroyer: Literary Devices'
    description: Analyze effects, not just names.
    xp: 30
    items:
      - id: sleep-imagery
        type: multiple_choice
        prompt: >-
          After the murder, Macbeth hears a voice cry "Macbeth does murder sleep." What is the
          most insightful reading of this line?
        choices:
          - It shows that Macbeth is tired.
          - It is an example of alliteration.
          - Sleep stands for innocence and peace, so by killing Duncan Macbeth has destroyed his own peace of mind.
          - It foreshadows that Macbeth will become a king.
        answer: 2
        explanation: It reads the image symbolically and links it to what Macbeth loses, which the play later confirms.

      - id: weak-to-strong
        type: multiple_choice
        prompt: >-
          A student writes, "Shakespeare uses a lot of imagery in Macbeth." Which revision is
          strongest?
        choices:
          - Shakespeare uses lots of different kinds of imagery throughout the play.
          - Shakespeare uses blood imagery, which is red.
          - Shakespeare's recurring blood imagery tracks Macbeth's guilt, shifting from a sign of honour in battle to a stain that cannot be washed away.
          - There is imagery in every act of Macbeth.
        answer: 2
        explanation: It names a specific image pattern and traces how its meaning changes.

      - id: knocking-effect
        type: multiple_choice
        prompt: >-
          Right after Duncan's murder, there is loud knocking at the castle gate. What is its
          main dramatic effect?
        choices:
          - It adds comic relief only
          - It heightens tension, as if the outside world is demanding to be let in on the crime
          - It shows the castle has visitors
          - It foreshadows that Duncan is still alive
        answer: 1
        explanation: The knocking forces the guilty Macbeths to act normal while the audience fears discovery.

      - id: oxymoron-effect
        type: multiple_choice
        prompt: '"So foul and fair a day I have not seen." Why does Shakespeare give Macbeth this line?'
        choices:
          - To describe the weather accurately
          - To echo the witches' "Fair is foul," linking Macbeth to them before he has even met them
          - To show Macbeth is confused about the time
          - It is a simile about the battle
        answer: 1
        explanation: The echo ties Macbeth's first words to the witches' paradox, suggesting he is already drawn into their world.
