# SBI4U — Strand B: Biochemistry

id: sbi4u-u1
title: Biochemistry
description: >-
  The molecules of life: carbohydrates, lipids, proteins and nucleic acids, and how they are
  built and broken down.

lessons:
  - id: sbi4u-u1-t1-learn
    kind: learn
    topic: Biological Molecules
    title: 'Learn: Biological Molecules'
    description: The four macromolecule families, and building and breaking polymers.
    xp: 10
    items:
      - type: teach
        id: four-families
        title: The four families of macromolecules
        blocks:
          - type: text
            md: |-
              | Macromolecule | Monomer (building block) | Example | Main job |
              |---|---|---|---|
              | Carbohydrates | monosaccharides (e.g. glucose) | starch, cellulose | energy, structure |
              | Lipids | glycerol + fatty acids | triglycerides | long-term energy, membranes |
              | Proteins | amino acids | enzymes, hemoglobin | almost everything |
              | Nucleic acids | nucleotides | DNA, RNA | store and use genetic information |
          - type: callout
            tone: tip
            md: Lipids aren't true polymers. A triglyceride is one glycerol joined to three fatty acids, not a long chain of repeats.

      - id: protein-monomer
        type: multiple_choice
        prompt: What are the monomers of proteins?
        choices: [nucleotides, monosaccharides, fatty acids, amino acids]
        answer: 3
        explanation: Proteins are chains of amino acids joined by peptide bonds.

      - type: teach
        id: dehydration-hydrolysis
        title: Building up and breaking down
        blocks:
          - type: text
            md: |-
              - **Dehydration synthesis** joins two monomers and **releases a water molecule**.
              - **Hydrolysis** breaks a bond by **adding a water molecule**.

              Joining $n$ monomers into a chain makes $n - 1$ bonds, so it releases $n - 1$
              water molecules.
          - type: callout
            tone: key
            md: 'Dehydration = water *out* (building). Hydrolysis = water *in* (breaking).'

      - id: building-releases
        type: multiple_choice
        prompt: Linking glucose molecules into starch by dehydration synthesis releases...
        choices: [oxygen, water, carbon dioxide, ATP]
        answer: 1
        explanation: Each new bond formed by dehydration synthesis releases one water molecule.

      - type: teach
        id: protein-structure
        title: Protein structure is function
        blocks:
          - type: text
            md: |-
              A protein's shape decides its job. Biologists describe four levels:

              1. **Primary**: the sequence of amino acids
              2. **Secondary**: local folding into α-helices and β-pleated sheets
              3. **Tertiary**: the overall 3D shape of one chain
              4. **Quaternary**: several chains working together (e.g. hemoglobin)
          - type: callout
            tone: warning
            title: Denaturation
            md: Heat or extreme pH can unfold a protein. It loses its shape, and with it, its function.

      - id: primary-structure
        type: multiple_choice
        prompt: What is a protein's primary structure?
        choices:
          - its 3D shape
          - its sequence of amino acids
          - its α-helices and β-sheets
          - the number of chains it has
        answer: 1
        explanation: The primary structure is simply the order of amino acids, coded for by the gene.

  - id: sbi4u-u1-t1-practice
    kind: practice
    topic: Biological Molecules
    title: 'Practice: Biological Molecules'
    description: Monomers, bonds and functions.
    xp: 10
    items:
      - id: glucose-type
        type: multiple_choice
        prompt: Glucose is a...
        choices: [disaccharide, monosaccharide, polysaccharide, fatty acid]
        answer: 1
        explanation: Glucose is a single sugar unit (a monosaccharide), the monomer of starch and cellulose.

      - id: triglyceride-parts
        type: multiple_choice
        prompt: A triglyceride is made of...
        choices:
          - three glycerols and one fatty acid
          - one glycerol and three fatty acids
          - three amino acids
          - three nucleotides
        answer: 1
        explanation: '"Tri" refers to the three fatty acids attached to one glycerol.'

      - id: dna-monomer
        type: multiple_choice
        prompt: What is the monomer of DNA?
        choices: [amino acid, nucleotide, glucose, glycerol]
        answer: 1
        explanation: Each nucleotide has a sugar, a phosphate group and a nitrogenous base.

      - id: enzymes-are
        type: multiple_choice
        prompt: Most enzymes are which type of macromolecule?
        choices: [carbohydrates, lipids, nucleic acids, proteins]
        answer: 3
        explanation: Enzymes are proteins whose shape lets them speed up specific reactions.

      - id: saturated-fats
        type: multiple_choice
        prompt: Saturated fatty acids have...
        choices:
          - no carbon–carbon double bonds
          - at least one carbon–carbon double bond
          - a ring structure
          - a phosphate group
        answer: 0
        explanation: '"Saturated" means every carbon holds as many hydrogens as possible, so there are no C=C double bonds.'

      - id: cellulose-role
        type: multiple_choice
        prompt: What does cellulose do in plants?
        choices: [stores energy, carries genetic information, gives cell walls their strength, speeds up reactions]
        answer: 2
        explanation: Cellulose is a structural polysaccharide that makes plant cell walls rigid.

  - id: sbi4u-u1-t1-destroyer
    kind: destroyer
    topic: Biological Molecules
    title: 'Destroyer: Biological Molecules'
    description: Counting reactions and explaining structure.
    xp: 30
    items:
      - id: polypeptide-water
        type: math_input
        prompt: How many water molecules are released when $10$ amino acids join to form one polypeptide chain?
        answer: '9'
        placeholder: Enter a number
        hint: How many bonds join 10 units in a single chain?
        explanation: 'A chain of $10$ amino acids has $9$ peptide bonds, and each releases one water molecule.'

      - id: fever-enzymes
        type: multiple_choice
        prompt: Why can a very high fever stop enzymes from working?
        choices:
          - Heat breaks the peptide bonds between amino acids
          - Heat denatures the enzyme, changing the shape of its active site
          - Heat turns enzymes into carbohydrates
          - Heat makes enzymes bind too tightly to water
        answer: 1
        explanation: >-
          High temperatures disrupt the weaker bonds that hold the 3D shape. The active site
          changes shape, so the substrate no longer fits. Peptide bonds stay intact.

      - id: triglyceride-water
        type: math_input
        prompt: How many water molecules are released when one triglyceride is formed?
        answer: '3'
        placeholder: Enter a number
        explanation: Each of the three fatty acids is attached to glycerol by dehydration synthesis, releasing one water each.

      - id: amino-acid-bond
        type: multiple_choice
        prompt: Which bond joins one amino acid to the next in a protein?
        choices: [glycosidic bond, ester bond, peptide bond, hydrogen bond]
        answer: 2
        explanation: Peptide bonds link amino acids. Glycosidic bonds join sugars, and ester bonds join fatty acids to glycerol.

  # =========================================================================================
  # Topic 2: Enzymes
  # =========================================================================================
  - id: sbi4u-u1-t2-learn
    kind: learn
    topic: Enzymes
    title: 'Learn: Enzymes'
    description: How enzymes work, what affects them, and how they're regulated.
    xp: 10
    items:
      - type: teach
        id: lowering-activation-energy
        title: Biological catalysts
        blocks:
          - type: text
            md: |-
              **Enzymes** are proteins that speed up reactions by lowering the
              **activation energy**. They are not used up, so one enzyme can work again and again.

              The reactant (the **substrate**) binds to the enzyme's **active site**. In the
              **induced fit** model, the active site changes shape slightly to grip the substrate.
          - type: callout
            tone: key
            md: Enzymes don't change how much energy a reaction releases, only how fast it gets started.

      - id: active-site
        type: multiple_choice
        prompt: Where does the substrate bind to an enzyme?
        choices: [The allosteric site, The active site, The cell membrane, The R group]
        answer: 1
        explanation: The active site has a shape and chemistry that match the substrate.

      - type: teach
        id: temperature-ph
        title: Temperature and pH
        blocks:
          - type: text
            md: |-
              Each enzyme has an **optimum** temperature and pH. Below the optimum, molecules
              collide less often. Above it, the enzyme **denatures**: its 3D shape unravels and
              the active site stops fitting.
          - type: graph
            x: [0, 60]
            y: [0, 110]
            x_label: temperature (°C)
            y_label: activity (%)
            curves:
              - { expr: 100((55 - x)/18)^4 exp(4(1 - (55 - x)/18)), domain: [0, 55] }
            points:
              - { at: [37, 100], label: 'optimum 37 °C' }
            caption: Activity rises with temperature, peaks, then drops sharply as the enzyme denatures.

      - id: why-drop
        type: multiple_choice
        prompt: Why does enzyme activity drop above the optimum temperature?
        choices:
          - The substrate runs out
          - The enzyme's shape changes, so the active site no longer fits the substrate
          - Molecules move too slowly
          - The enzyme turns into a carbohydrate
        answer: 1
        explanation: Heat breaks the bonds that hold the protein's shape. That's denaturation.

      - type: teach
        id: inhibitors
        title: Inhibitors
        blocks:
          - type: text
            md: |-
              - **Competitive** inhibitors look like the substrate and block the active site.
                Adding more substrate can outcompete them.
              - **Non-competitive** (allosteric) inhibitors bind somewhere else and change the
                active site's shape. More substrate doesn't help.

              Cells use **feedback inhibition**: the final product of a pathway inhibits an
              enzyme near the start, so the cell doesn't make too much.

      - id: competitive-fix
        type: multiple_choice
        prompt: Which type of inhibition can be overcome by adding more substrate?
        choices: [Non-competitive, Allosteric, Denaturation, Competitive]
        answer: 3
        explanation: More substrate molecules win more of the competition for the active site.

  - id: sbi4u-u1-t2-practice
    kind: practice
    topic: Enzymes
    title: 'Practice: Enzymes'
    description: Key terms and the activity graph.
    xp: 10
    items:
      - id: enzyme-made-of
        type: multiple_choice
        prompt: Most enzymes are made of which type of macromolecule?
        choices: [Carbohydrates, Lipids, Proteins, Nucleic acids]
        answer: 2
        explanation: Enzymes are proteins folded into precise 3D shapes.

      - id: catalyst-role
        type: multiple_choice
        prompt: How do enzymes speed up reactions?
        choices:
          - By adding energy to the reaction
          - By lowering the activation energy
          - By raising the temperature of the cell
          - By being used up as reactants
        answer: 1
        explanation: A lower energy barrier means more collisions succeed.

      - id: read-optimum
        type: math_input
        prompt: 'At what temperature, in °C, does this enzyme work best?'
        figure:
          type: graph
          x: [0, 100]
          y: [0, 110]
          x_label: temperature (°C)
          y_label: activity (%)
          curves: [{ expr: 100((88 - x)/18)^4 exp(4(1 - (88 - x)/18)), domain: [0, 88] }]
        answer: '70'
        tolerance: 2
        placeholder: °C
        explanation: The peak is at about 70 °C. This could be an enzyme from a hot-spring bacterium.

      - id: pepsin-ph
        type: multiple_choice
        prompt: Pepsin digests protein in the stomach. Its optimum pH is most likely...
        choices: ['about 2', 'about 7', 'about 9', 'about 12']
        answer: 0
        explanation: Stomach acid is around pH 2, so pepsin works best there.

      - id: denature-meaning
        type: multiple_choice
        prompt: What does it mean when an enzyme is denatured?
        choices:
          - It has been used up
          - It has lost its 3D shape
          - It has been made more active
          - It has bonded permanently to its substrate
        answer: 1
        explanation: Denaturation unravels the protein, so the active site no longer works.

      - id: induced-fit
        type: multiple_choice
        prompt: The induced fit model says that...
        choices:
          - the active site is rigid, like a lock
          - any substrate can fit any enzyme
          - the active site changes shape slightly when the substrate binds
          - the enzyme is destroyed after the reaction
        answer: 2
        explanation: The enzyme moulds around the substrate as it binds.

  - id: sbi4u-u1-t2-destroyer
    kind: destroyer
    topic: Enzymes
    title: 'Destroyer: Enzymes'
    description: Experiments, inhibitors and regulation.
    xp: 30
    items:
      - id: cooling-vs-heating
        type: multiple_choice
        prompt: >-
          An enzyme is cooled from 37 °C to 5 °C, then warmed back to 37 °C. Another is heated
          to 80 °C, then cooled back to 37 °C. Which one recovers its activity?
        choices:
          - Neither
          - The heated one only
          - The cooled one only
          - Both recover fully
        answer: 2
        explanation: Cold only slows molecules down. High heat denatures the enzyme, which is usually permanent.

      - id: identify-inhibitor
        type: multiple_choice
        prompt: >-
          A drug slows an enzyme. Adding lots of extra substrate restores the reaction to its
          normal maximum rate. What kind of inhibitor is the drug?
        choices: [Non-competitive, Competitive, An allosteric activator, A coenzyme]
        answer: 1
        explanation: If more substrate overcomes it, the drug must be competing for the active site.

      - id: feedback-loop
        type: multiple_choice
        prompt: >-
          In a pathway A → B → C → D, product D inhibits the enzyme that turns A into B.
          What happens when D builds up?
        choices:
          - More A is converted to B
          - The pathway slows, so less D is made
          - C converts directly into A
          - The enzyme is denatured
        answer: 1
        explanation: This is feedback inhibition, a self-regulating off switch.

      - id: rate-percent
        type: math_input
        prompt: >-
          Without an inhibitor, an enzyme makes 80 µmol of product per minute. With a
          non-competitive inhibitor, it makes 20 µmol per minute. By what percentage did the
          rate decrease?
        answer: '75'
        placeholder: '%'
        explanation: '$\dfrac{80 - 20}{80} \times 100\% = 75\%$'
