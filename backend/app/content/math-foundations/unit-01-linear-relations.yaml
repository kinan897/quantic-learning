# Math Foundations (Grade 8, MTH1W, MPM2D) — Linear relations

id: math-foundations-u1
title: Linear Relations
description: >-
  Slope, the y-intercept and the equation y = mx + b: the language of straight lines.

lessons:
  - id: math-foundations-u1-t1-learn
    kind: learn
    topic: Slope and y = mx + b
    title: 'Learn: Slope and y = mx + b'
    description: What slope means, where the y-intercept is, and how to read y = mx + b.
    xp: 10
    items:
      - type: teach
        id: slope-is-steepness
        title: Slope measures steepness
        blocks:
          - type: text
            md: >-
              The **slope** of a line tells you how steep it is: how far it goes **up** (the
              rise) for every step **across** (the run).
          - type: graph
            x: [0, 4]
            y: [0, 9]
            curves:
              - { expr: 2x + 1, label: y = 2x + 1 }
            segments:
              - { from: [1, 3], to: [3, 3], color: accent, dashed: true, label: run = 2 }
              - { from: [3, 3], to: [3, 7], color: accent, dashed: true, label: rise = 4 }
            points:
              - { at: [1, 3], label: '(1, 3)' }
              - { at: [3, 7], label: '(3, 7)' }
          - type: callout
            tone: key
            md: '$m = \dfrac{\text{rise}}{\text{run}} = \dfrac{y_2 - y_1}{x_2 - x_1} = \dfrac{7 - 3}{3 - 1} = 2$'

      - id: slope-from-two-points
        type: math_input
        prompt: 'Find the slope of the line through $(1, 2)$ and $(4, 11)$.'
        answer: '3'
        placeholder: Enter a number
        hint: 'Rise $= 11 - 2$, run $= 4 - 1$.'
        explanation: '$m = \dfrac{11 - 2}{4 - 1} = \dfrac{9}{3} = 3$'

      - type: teach
        id: y-intercept
        title: The y-intercept
        blocks:
          - type: text
            md: >-
              The **y-intercept** is where the line crosses the $y$-axis, the point where
              $x = 0$. It's the line's starting value.
          - type: graph
            x: [-1, 4]
            y: [0, 12]
            curves:
              - { expr: 2x + 3, label: y = 2x + 3 }
            points:
              - { at: [0, 3], label: 'y-intercept (0, 3)', color: accent }
          - type: callout
            tone: tip
            md: To find the $y$-intercept from an equation, set $x = 0$.

      - id: read-y-intercept
        type: multiple_choice
        prompt: 'What is the $y$-intercept of $y = -4x + 7$?'
        choices: ['$-4$', '$7$', '$4$', '$-7$']
        answer: 1
        explanation: 'Set $x = 0$: $y = -4(0) + 7 = 7$. The $-4$ is the slope.'

      - type: teach
        id: slope-intercept-form
        title: Reading y = mx + b
        blocks:
          - type: text
            md: >-
              Every non-vertical line can be written as $y = mx + b$, where $m$ is the slope and
              $b$ is the $y$-intercept. The sign of $m$ tells you the direction.
          - type: graph
            x: [0, 5]
            y: [-1, 8]
            curves:
              - { expr: 2x - 1, label: 'm = 2: rises' }
              - { expr: -x + 6, color: accent, label: 'm = −1: falls' }
              - { expr: '3', color: muted, label: 'm = 0: flat' }
          - type: callout
            tone: key
            md: '$m > 0$ rises left to right, $m < 0$ falls, and $m = 0$ is horizontal.'

      - id: which-line-falls
        type: multiple_choice
        prompt: Which line falls from left to right?
        choices: ['$y = 3x - 2$', '$y = 4$', '$y = -2x + 5$', '$y = x$']
        answer: 2
        explanation: Only $y = -2x + 5$ has a negative slope ($m = -2$), so it falls.

  - id: math-foundations-u1-t1-practice
    kind: practice
    topic: Slope and y = mx + b
    title: 'Practice: Slope and y = mx + b'
    description: Quick questions on slope and intercepts.
    xp: 10
    items:
      - id: slope-from-origin
        type: math_input
        prompt: 'Find the slope of the line through $(0, 0)$ and $(2, 6)$.'
        answer: '3'
        placeholder: Enter a number
        explanation: '$\dfrac{6 - 0}{2 - 0} = 3$'

      - id: read-m-and-b
        type: multiple_choice
        prompt: 'For $y = 5x - 2$, what are the slope and $y$-intercept?'
        choices:
          - '$m = -2,\ b = 5$'
          - '$m = 2,\ b = 5$'
          - '$m = 5,\ b = -2$'
          - '$m = 5,\ b = 2$'
        answer: 2
        explanation: 'In $y = mx + b$, the number in front of $x$ is $m = 5$ and the constant is $b = -2$.'

      - id: equation-from-graph
        type: multiple_choice
        prompt: What is the equation of this line?
        figure:
          type: graph
          x: [-1, 4]
          y: [-1, 6]
          curves: [{ expr: -2x + 4 }]
          points:
            - { at: [0, 4], label: '(0, 4)' }
            - { at: [2, 0], label: '(2, 0)' }
        choices: ['$y = 2x + 4$', '$y = -2x + 4$', '$y = 4x - 2$', '$y = -x + 2$']
        answer: 1
        explanation: 'It crosses the $y$-axis at $4$, and falls $4$ while moving right $2$: $m = -2$. So $y = -2x + 4$.'

      - id: substitute-x
        type: math_input
        prompt: 'For $y = 3x + 1$, find $y$ when $x = 4$.'
        answer: '13'
        placeholder: Enter a number
        explanation: '$y = 3(4) + 1 = 13$'

      - id: horizontal-slope
        type: multiple_choice
        prompt: 'What is the slope of the horizontal line $y = 3$?'
        choices: ['$3$', '$1$', 'undefined', '$0$']
        answer: 3
        explanation: A horizontal line never rises, so the rise is $0$ and the slope is $0$.

      - id: fractional-slope
        type: math_input
        prompt: Find the slope of this line.
        figure:
          type: graph
          x: [-1, 6]
          y: [-1, 5]
          curves: [{ expr: x/2 + 1 }]
          points:
            - { at: [0, 1], label: '(0, 1)' }
            - { at: [4, 3], label: '(4, 3)' }
        answer: 1/2
        display_answer: '$\dfrac{1}{2}$'
        placeholder: Enter a number or fraction
        explanation: '$\dfrac{3 - 1}{4 - 0} = \dfrac{2}{4} = \dfrac{1}{2}$'

  - id: math-foundations-u1-t1-destroyer
    kind: destroyer
    topic: Slope and y = mx + b
    title: 'Destroyer: Slope and y = mx + b'
    description: Build equations and model real situations.
    xp: 30
    items:
      - id: point-slope-equation
        type: math_input
        prompt: 'Find the equation of the line through $(2, 5)$ with slope $3$. Write it as $y = mx + b$.'
        answer: 3x - 1
        display_answer: '$y = 3x - 1$'
        variables: [x]
        placeholder: y = mx + b
        hint: 'Substitute the point into $y = 3x + b$ and solve for $b$.'
        explanation: '$5 = 3(2) + b \Rightarrow b = -1$, so $y = 3x - 1$.'

      - id: two-point-equation
        type: math_input
        prompt: 'Find the equation of the line through $(1, 4)$ and $(3, 10)$.'
        answer: 3x + 1
        display_answer: '$y = 3x + 1$'
        variables: [x]
        placeholder: y = mx + b
        hint: Find the slope first, then the $y$-intercept.
        explanation: '$m = \dfrac{10 - 4}{3 - 1} = 3$. Then $4 = 3(1) + b \Rightarrow b = 1$.'

      - id: taxi-model
        type: multiple_choice
        prompt: >-
          A taxi charges a flat fee of 4 dollars plus 2 dollars per kilometre. Which equation
          gives the cost $C$ (in dollars) for a trip of $d$ km?
        choices: ['$C = 4d + 2$', '$C = 6d$', '$C = 2d - 4$', '$C = 2d + 4$']
        answer: 3
        explanation: >-
          The cost per kilometre is the rate of change (slope): $2$. The flat fee is the
          starting value ($y$-intercept): $4$. So $C = 2d + 4$.

      - id: x-intercept
        type: math_input
        prompt: 'Where does $y = 2x - 6$ cross the $x$-axis? Give the $x$-value.'
        answer: '3'
        placeholder: Enter a number
        hint: On the $x$-axis, $y = 0$.
        explanation: '$0 = 2x - 6 \Rightarrow x = 3$'

  # =========================================================================================
  # Topic 2: Solving linear equations
  # =========================================================================================
  - id: math-foundations-u1-t2-learn
    kind: learn
    topic: Solving Linear Equations
    title: 'Learn: Solving Linear Equations'
    description: Balance both sides, collect terms, and clear brackets and fractions.
    xp: 10
    items:
      - type: teach
        id: keep-it-balanced
        title: Keep it balanced
        blocks:
          - type: text
            md: |-
              An equation is like a balanced scale: whatever you do to one side, do to the
              other. Undo operations in reverse order to get $x$ alone.

              $$3x + 5 = 20 \;\Rightarrow\; 3x = 15 \;\Rightarrow\; x = 5$$
          - type: graph
            x: [0, 8]
            y: [0, 26]
            curves:
              - { expr: 3x + 5, label: y = 3x + 5 }
              - { expr: '20', color: accent, label: y = 20 }
            points:
              - { at: [5, 20], label: 'x = 5' }
            caption: The solution is where the two sides are equal, where the graphs meet.

      - id: two-step-equation
        type: math_input
        prompt: 'Solve $2x + 7 = 19$.'
        answer: '6'
        placeholder: x = ?
        explanation: '$2x = 12$, so $x = 6$.'

      - type: teach
        id: variables-both-sides
        title: Variables on both sides
        blocks:
          - type: text
            md: |-
              Collect the $x$-terms on one side and the numbers on the other:

              $$5x - 4 = 2x + 11 \;\Rightarrow\; 3x = 15 \;\Rightarrow\; x = 5$$
          - type: callout
            tone: tip
            md: Move the smaller $x$-term so you're left with a positive coefficient.

      - id: both-sides-check
        type: math_input
        prompt: 'Solve $7x - 2 = 3x + 10$.'
        answer: '3'
        placeholder: x = ?
        explanation: '$7x - 3x = 10 + 2 \Rightarrow 4x = 12 \Rightarrow x = 3$'

      - type: teach
        id: brackets-and-fractions
        title: Brackets and fractions
        blocks:
          - type: text
            md: |-
              - **Brackets**: expand first. $3(x - 2) = 12 \Rightarrow 3x - 6 = 12 \Rightarrow x = 6$.
              - **Fractions**: multiply every term by the denominator.
                $\dfrac{x}{4} + 1 = 3 \Rightarrow x + 4 = 12 \Rightarrow x = 8$.
          - type: callout
            tone: warning
            title: Common mistake
            md: 'Multiply **every** term when clearing fractions, including the ones without a denominator.'

      - id: bracket-check
        type: math_input
        prompt: 'Solve $2(x + 3) = 18$.'
        answer: '6'
        placeholder: x = ?
        explanation: '$2x + 6 = 18 \Rightarrow 2x = 12 \Rightarrow x = 6$'

  - id: math-foundations-u1-t2-practice
    kind: practice
    topic: Solving Linear Equations
    title: 'Practice: Solving Linear Equations'
    description: One- and two-step equations.
    xp: 10
    items:
      - id: one-step-add
        type: math_input
        prompt: 'Solve $x + 9 = 4$.'
        answer: '-5'
        placeholder: x = ?
        explanation: Subtract $9$ from both sides.

      - id: one-step-multiply
        type: math_input
        prompt: 'Solve $5x = 35$.'
        answer: '7'
        placeholder: x = ?
        explanation: Divide both sides by $5$.

      - id: two-step-practice
        type: math_input
        prompt: 'Solve $3x - 8 = 10$.'
        answer: '6'
        placeholder: x = ?
        explanation: '$3x = 18 \Rightarrow x = 6$'

      - id: divide-by-three
        type: math_input
        prompt: 'Solve $\dfrac{x}{3} = 5$.'
        answer: '15'
        placeholder: x = ?
        explanation: Multiply both sides by $3$.

      - id: first-step
        type: multiple_choice
        prompt: 'What is the best first step to solve $4x + 6 = 30$?'
        choices: [Divide both sides by 6, Subtract 6 from both sides, Add 4 to both sides, Multiply both sides by 4]
        answer: 1
        explanation: 'Undo the $+6$ first to get $4x = 24$, then divide by $4$.'

      - id: check-solution
        type: multiple_choice
        prompt: 'Is $x = 2$ a solution of $3x + 1 = 7$?'
        choices:
          - 'Yes, because $3(2) + 1 = 7$'
          - 'No, because $3(2) + 1 = 6$'
          - 'No, because $2 + 1 = 3$'
          - Only if $x$ is negative
        answer: 0
        explanation: Substituting $x = 2$ makes both sides equal to $7$, so it is a solution.

  - id: math-foundations-u1-t2-destroyer
    kind: destroyer
    topic: Solving Linear Equations
    title: 'Destroyer: Solving Linear Equations'
    description: Brackets, fractions and word problems.
    xp: 30
    items:
      - id: brackets-both-sides
        type: math_input
        prompt: 'Solve $6(x - 1) = 2(x + 7)$.'
        answer: '5'
        placeholder: x = ?
        explanation: '$6x - 6 = 2x + 14 \Rightarrow 4x = 20 \Rightarrow x = 5$'

      - id: fractions-both-sides
        type: math_input
        prompt: 'Solve $\dfrac{x + 2}{3} = \dfrac{x - 1}{2}$.'
        answer: '7'
        placeholder: x = ?
        hint: Multiply both sides by $6$.
        explanation: '$2(x + 2) = 3(x - 1) \Rightarrow 2x + 4 = 3x - 3 \Rightarrow x = 7$'

      - id: phone-plan
        type: math_input
        prompt: >-
          A phone plan costs 20 dollars a month plus 0.10 dollars per minute. How many minutes
          make the monthly bill 35 dollars?
        answer: '150'
        placeholder: minutes
        explanation: '$20 + 0.10m = 35 \Rightarrow 0.10m = 15 \Rightarrow m = 150$ minutes'

      - id: rectangle-width
        type: math_input
        prompt: >-
          A rectangle's length is $3$ cm more than twice its width. Its perimeter is $54$ cm.
          Find the width, in cm.
        answer: '8'
        placeholder: cm
        hint: 'Let the width be $w$, so the length is $2w + 3$.'
        explanation: '$2(2w + 3) + 2w = 54 \Rightarrow 6w + 6 = 54 \Rightarrow w = 8$ cm'
