# MHF4U — Strand C: Polynomial and Rational Functions

id: mhf4u-u1
title: Polynomial Functions
description: >-
  Degree, leading coefficient, end behaviour and zeros: reading a polynomial's shape
  straight from its equation.

lessons:
  - id: mhf4u-u1-t1-learn
    kind: learn
    topic: Polynomial Basics
    title: 'Learn: Polynomial Basics'
    description: Degree, leading coefficient, end behaviour and zeros.
    xp: 10
    items:
      - type: teach
        id: what-is-a-polynomial
        title: What is a polynomial?
        blocks:
          - type: text
            md: |-
              A **polynomial** is a sum of terms of the form $a x^n$, where $n$ is a whole
              number. Two features control its shape:

              - **Degree**: the highest power of $x$
              - **Leading coefficient**: the number in front of that highest power

              For $f(x) = -2x^3 + 5x - 1$: degree $3$, leading coefficient $-2$.
          - type: callout
            tone: warning
            title: Not polynomials
            md: '$\dfrac{1}{x}$, $\sqrt{x}$ and $2^x$ are **not** polynomials: the powers must be whole numbers $0, 1, 2, \dots$'

      - id: identify-degree
        type: multiple_choice
        prompt: 'What is the degree of $f(x) = 4x^5 - x^2 + 7$?'
        choices: ['$4$', '$2$', '$5$', '$7$']
        answer: 2
        explanation: 'The highest power of $x$ is $5$. The $4$ is the leading coefficient.'

      - type: teach
        id: end-behaviour
        title: End behaviour
        blocks:
          - type: text
            md: >-
              **End behaviour** describes what $y$ does at the far left and far right of the
              graph. It depends only on the degree (odd or even) and the sign of the leading
              coefficient.
          - type: graph
            x: [-2.2, 2.2]
            y: [-6, 6]
            curves:
              - { expr: x^3, label: 'x³: odd, positive' }
              - { expr: -x^4 + 2, color: accent, label: '−x⁴ + 2: even, negative' }
          - type: text
            md: |-
              | | Leading coefficient $> 0$ | Leading coefficient $< 0$ |
              |---|---|---|
              | **Odd degree** | falls left, rises right | rises left, falls right |
              | **Even degree** | rises on both ends | falls on both ends |

      - id: odd-negative-graph
        type: multiple_choice
        prompt: 'Which graph could be $f(x) = -x^3 + 2x$?'
        choices:
          - { type: graph, x: [-2.2, 2.2], y: [-4, 4], curves: [{ expr: x^3 - 2x }] }
          - { type: graph, x: [-2.2, 2.2], y: [-4, 4], curves: [{ expr: x^4 - 2x^2 }] }
          - { type: graph, x: [-2.2, 2.2], y: [-4, 4], curves: [{ expr: -x^3 + 2x }] }
          - { type: graph, x: [-2.2, 2.2], y: [-4, 4], curves: [{ expr: -x^4 + 2x^2 }] }
        answer: 2
        hint: Odd degree, negative leading coefficient. Which way do the ends point?
        explanation: >-
          Degree $3$ (odd) with a negative leading coefficient: the graph **rises on the left
          and falls on the right**. Only graph C does that.

      - type: teach
        id: zeros-factored-form
        title: Zeros from factored form
        blocks:
          - type: text
            md: >-
              In factored form you can read the **zeros** ($x$-intercepts) directly: each factor
              $(x - a)$ gives a zero at $x = a$.
          - type: graph
            x: [-3, 4]
            y: [-12, 12]
            curves:
              - { expr: (x - 1)(x + 2)(x - 3), label: 'f(x) = (x − 1)(x + 2)(x − 3)' }
            points:
              - { at: [-2, 0], label: '−2', color: accent }
              - { at: [1, 0], label: '1', color: accent }
              - { at: [3, 0], label: '3', color: accent }
              - { at: [0, 6], label: '(0, 6)' }
          - type: callout
            tone: tip
            md: 'The $y$-intercept is $f(0)$: multiply the constants. Here $(-1)(2)(-3) = 6$.'

      - id: y-intercept-factored
        type: math_input
        prompt: 'What is the $y$-intercept of $f(x) = (x + 1)(x - 2)(x + 4)$?'
        answer: '-8'
        placeholder: Enter a number
        explanation: '$f(0) = (1)(-2)(4) = -8$'

  - id: mhf4u-u1-t1-practice
    kind: practice
    topic: Polynomial Basics
    title: 'Practice: Polynomial Basics'
    description: Degree, end behaviour and zeros at a glance.
    xp: 10
    items:
      - id: leading-coefficient
        type: multiple_choice
        prompt: 'What is the leading coefficient of $f(x) = 3 - 2x + 7x^4$?'
        choices: ['$3$', '$-2$', '$4$', '$7$']
        answer: 3
        explanation: 'The highest power is $x^4$, and its coefficient is $7$. Order of terms doesn''t matter.'

      - id: even-positive-ends
        type: multiple_choice
        prompt: 'Describe the end behaviour of $f(x) = 2x^4$.'
        choices:
          - Falls left, rises right
          - Rises on both ends
          - Rises left, falls right
          - Falls on both ends
        answer: 1
        explanation: Even degree with a positive leading coefficient points up on both ends, like a parabola.

      - id: positive-zero
        type: math_input
        prompt: 'What is the positive zero of $f(x) = (x - 4)(x + 1)$?'
        answer: '4'
        placeholder: Enter a number
        explanation: 'Set each factor to zero: $x = 4$ or $x = -1$. The positive one is $4$.'

      - id: count-intercepts
        type: multiple_choice
        prompt: How many $x$-intercepts does this graph have?
        figure:
          type: graph
          x: [-3, 3]
          y: [-5, 5]
          curves: [{ expr: x^3 - 4x }]
        choices: ['$1$', '$2$', '$3$', '$4$']
        answer: 2
        explanation: 'It crosses at $x = -2$, $0$ and $2$, because $x^3 - 4x = x(x - 2)(x + 2)$.'

      - id: max-turning-points
        type: multiple_choice
        prompt: What is the greatest number of turning points a degree 5 polynomial can have?
        choices: ['$5$', '$4$', '$6$', '$3$']
        answer: 1
        explanation: A degree $n$ polynomial has at most $n - 1$ turning points, so at most $4$.

      - id: evaluate-cubic
        type: math_input
        prompt: 'If $f(x) = x^3 - 2x + 1$, find $f(2)$.'
        answer: '5'
        placeholder: Enter a number
        explanation: '$f(2) = 8 - 4 + 1 = 5$'

  - id: mhf4u-u1-t1-destroyer
    kind: destroyer
    topic: Polynomial Basics
    title: 'Destroyer: Polynomial Basics'
    description: Multiplicity, factor theorem and harder end behaviour.
    xp: 30
    items:
      - id: y-intercept-with-repeat
        type: math_input
        prompt: 'Find the $y$-intercept of $f(x) = 2(x - 1)^2(x + 3)$.'
        answer: '6'
        placeholder: Enter a number
        explanation: '$f(0) = 2(-1)^2(3) = 2 \cdot 1 \cdot 3 = 6$'

      - id: odd-negative-ends
        type: multiple_choice
        prompt: 'Describe the end behaviour of $f(x) = -3x^5 + 4x^2 - 1$.'
        choices:
          - 'As $x \to -\infty$, $y \to +\infty$; as $x \to +\infty$, $y \to -\infty$'
          - 'As $x \to -\infty$, $y \to -\infty$; as $x \to +\infty$, $y \to +\infty$'
          - 'As $x \to \pm\infty$, $y \to +\infty$'
          - 'As $x \to \pm\infty$, $y \to -\infty$'
        answer: 0
        explanation: Odd degree with a negative leading coefficient rises on the left and falls on the right.

      - id: multiplicity-two
        type: multiple_choice
        prompt: 'At a zero of multiplicity $2$, such as $x = 1$ in $f(x) = (x - 1)^2(x + 2)$, the graph...'
        figure:
          type: graph
          x: [-3, 2.5]
          y: [-3, 6]
          curves: [{ expr: (x - 1)^2(x + 2) }]
          points:
            - { at: [1, 0], color: accent }
        choices:
          - crosses the $x$-axis in a straight line
          - touches the $x$-axis and turns back
          - has a vertical asymptote
          - does not reach the $x$-axis
        answer: 1
        explanation: >-
          A squared factor doesn't change sign, so the graph touches the axis at $x = 1$ and
          bounces back instead of crossing.

      - id: factor-theorem-k
        type: math_input
        prompt: 'Find $k$ if $(x - 2)$ is a factor of $p(x) = x^3 + kx - 4$.'
        answer: '-2'
        placeholder: Enter a number
        hint: 'Factor theorem: $(x - 2)$ is a factor exactly when $p(2) = 0$.'
        explanation: '$p(2) = 8 + 2k - 4 = 0 \Rightarrow 2k = -4 \Rightarrow k = -2$'

  # =========================================================================================
  # Topic 2: Dividing polynomials
  # =========================================================================================
  - id: mhf4u-u1-t2-learn
    kind: learn
    topic: Dividing Polynomials
    title: 'Learn: Dividing Polynomials'
    description: Long division, the remainder theorem and the factor theorem.
    xp: 10
    items:
      - type: teach
        id: polynomial-division
        title: Dividing polynomials
        blocks:
          - type: text
            md: |-
              Polynomials divide like numbers. Every division can be written as

              $$p(x) = d(x)\,q(x) + r(x)$$

              (dividend $=$ divisor $\times$ quotient $+$ remainder). For example:

              - $(x^2 + 5x + 6) \div (x + 2) = x + 3$, remainder $0$
              - $(x^2 + 3x + 5) \div (x + 1) = x + 2$, remainder $3$
          - type: callout
            tone: tip
            md: 'Check by multiplying back: $(x + 1)(x + 2) + 3 = x^2 + 3x + 5$.'

      - id: divide-quadratic
        type: math_input
        prompt: 'Find the quotient of $(x^2 + 7x + 12) \div (x + 3)$.'
        answer: x + 4
        display_answer: '$x + 4$'
        variables: [x]
        placeholder: e.g. x + 1
        explanation: '$x^2 + 7x + 12 = (x + 3)(x + 4)$, so the quotient is $x + 4$ with remainder $0$.'

      - type: teach
        id: remainder-theorem
        title: The remainder theorem
        blocks:
          - type: text
            md: |-
              When $p(x)$ is divided by $(x - a)$, the remainder is $p(a)$. No division needed!

              For $p(x) = x^3 - 2x + 1$ divided by $(x - 2)$: $p(2) = 8 - 4 + 1 = 5$.
          - type: callout
            tone: warning
            title: Watch the sign
            md: 'Dividing by $(x + 3)$ means $a = -3$, so evaluate $p(-3)$.'

      - id: remainder-check
        type: math_input
        prompt: 'Find the remainder when $x^3 + x^2 - 4$ is divided by $(x - 1)$.'
        answer: '-2'
        placeholder: Enter a number
        explanation: '$p(1) = 1 + 1 - 4 = -2$'

      - type: teach
        id: factor-theorem
        title: The factor theorem
        blocks:
          - type: text
            md: |-
              $(x - a)$ is a **factor** of $p(x)$ exactly when $p(a) = 0$. To find factors, test
              the integers that divide the constant term.

              $p(x) = x^3 - 6x^2 + 11x - 6$: $p(1) = 0$, $p(2) = 0$, $p(3) = 0$, so
              $p(x) = (x - 1)(x - 2)(x - 3)$.
          - type: graph
            x: [-0.5, 4]
            y: [-3, 3]
            curves:
              - { expr: x^3 - 6x^2 + 11x - 6, label: y = p(x) }
            points:
              - { at: [1, 0], label: '1', color: accent }
              - { at: [2, 0], label: '2', color: accent }
              - { at: [3, 0], label: '3', color: accent }
            caption: Each factor $(x - a)$ is a zero where the graph crosses the $x$-axis.

      - id: which-factor
        type: multiple_choice
        prompt: 'Which is a factor of $p(x) = x^3 - 6x^2 + 11x - 6$?'
        choices: ['$(x + 1)$', '$(x + 3)$', '$(x - 3)$', '$(x - 6)$']
        answer: 2
        explanation: '$p(3) = 27 - 54 + 33 - 6 = 0$, so $(x - 3)$ is a factor.'

  - id: mhf4u-u1-t2-practice
    kind: practice
    topic: Dividing Polynomials
    title: 'Practice: Dividing Polynomials'
    description: Remainders and factors without long division.
    xp: 10
    items:
      - id: remainder-quadratic
        type: math_input
        prompt: 'Find the remainder when $x^2 + 4x + 1$ is divided by $(x - 1)$.'
        answer: '6'
        placeholder: Enter a number
        explanation: '$p(1) = 1 + 4 + 1 = 6$'

      - id: evaluate-negative
        type: math_input
        prompt: 'If $p(x) = 2x^3 - x + 4$, find $p(-1)$.'
        answer: '3'
        placeholder: Enter a number
        explanation: '$p(-1) = -2 + 1 + 4 = 3$'

      - id: zero-means-factor
        type: multiple_choice
        prompt: 'If $p(4) = 0$, which must be true?'
        choices:
          - '$(x + 4)$ is a factor of $p(x)$'
          - '$(x - 4)$ is a factor of $p(x)$'
          - '$p(x)$ has degree 4'
          - 'The remainder of $p(x) \div (x - 4)$ is $4$'
        answer: 1
        explanation: 'By the factor theorem, $p(4) = 0$ means $(x - 4)$ is a factor.'

      - id: difference-of-squares
        type: math_input
        prompt: 'Find the quotient of $(x^2 - 9) \div (x - 3)$.'
        answer: x + 3
        display_answer: '$x + 3$'
        variables: [x]
        placeholder: e.g. x + 1
        explanation: '$x^2 - 9 = (x - 3)(x + 3)$'

      - id: possible-zeros
        type: multiple_choice
        prompt: 'Which values should you test as possible integer zeros of $x^3 + 2x^2 - 5x - 6$?'
        choices:
          - '$\pm 1,\ \pm 2,\ \pm 5$'
          - '$\pm 1,\ \pm 2,\ \pm 3,\ \pm 6$'
          - '$\pm 1,\ \pm 5$'
          - '$0,\ \pm 6$'
        answer: 1
        explanation: Integer zeros must divide the constant term, $-6$.

      - id: remainder-plus-two
        type: math_input
        prompt: 'Find the remainder when $x^3$ is divided by $(x + 2)$.'
        answer: '-8'
        placeholder: Enter a number
        explanation: '$a = -2$, so the remainder is $(-2)^3 = -8$.'

  - id: mhf4u-u1-t2-destroyer
    kind: destroyer
    topic: Dividing Polynomials
    title: 'Destroyer: Dividing Polynomials'
    description: Unknown coefficients and full factoring.
    xp: 30
    items:
      - id: find-k-remainder
        type: math_input
        prompt: 'Find $k$ so that $x^3 + kx^2 - 3$ leaves a remainder of $4$ when divided by $(x - 1)$.'
        answer: '6'
        placeholder: k = ?
        explanation: '$p(1) = 1 + k - 3 = 4 \Rightarrow k = 6$'

      - id: factor-fully
        type: multiple_choice
        prompt: 'Factor $x^3 - 7x - 6$ fully.'
        choices:
          - '$(x - 1)(x - 2)(x + 3)$'
          - '$(x + 1)(x + 2)(x - 3)$'
          - '$(x + 1)(x - 2)(x + 3)$'
          - '$(x - 1)(x + 6)(x + 1)$'
        answer: 1
        hint: 'Test $p(-1)$ first.'
        explanation: '$p(-1) = -1 + 7 - 6 = 0$. Dividing gives $x^2 - x - 6 = (x + 2)(x - 3)$.'

      - id: synthetic-quotient
        type: math_input
        prompt: 'Find the quotient when $2x^3 + 3x^2 - 2x + 5$ is divided by $(x + 2)$.'
        answer: 2x^2 - x
        display_answer: '$2x^2 - x$ (remainder $5$)'
        variables: [x]
        placeholder: e.g. x^2 + 1
        explanation: |-
          Synthetic division with $-2$: coefficients $2,\ 3,\ -2,\ 5 \rightarrow 2,\ -1,\ 0$ with
          remainder $5$. So the quotient is $2x^2 - x$.

      - id: two-factors-unknowns
        type: math_input
        prompt: >-
          $(x - 2)$ and $(x + 1)$ are both factors of $x^3 + ax^2 + bx + 2$. Find $a$.
        answer: '-2'
        placeholder: a = ?
        hint: 'Set $p(2) = 0$ and $p(-1) = 0$, then solve the two equations.'
        explanation: |-
          $p(2) = 8 + 4a + 2b + 2 = 0 \Rightarrow 2a + b = -5$

          $p(-1) = -1 + a - b + 2 = 0 \Rightarrow a - b = -1$

          Adding: $3a = -6$, so $a = -2$ (and $b = -1$).
