# Science Foundations (Grade 8 science, SNC1W, SNC2D) — Atoms and elements

id: science-foundations-u1
title: Atoms and Elements
description: >-
  What atoms are made of, how to read atomic number and mass number, and how electrons are
  arranged in shells.

lessons:
  - id: science-foundations-u1-t1-learn
    kind: learn
    topic: Inside the Atom
    title: 'Learn: Inside the Atom'
    description: Protons, neutrons, electrons and Bohr–Rutherford diagrams.
    xp: 10
    items:
      - type: teach
        id: three-particles
        title: Three particles
        blocks:
          - type: text
            md: |-
              Every atom is built from three kinds of particles:

              | Particle | Charge | Where it is | Relative mass |
              |---|---|---|---|
              | Proton | $+1$ | nucleus | $1$ |
              | Neutron | $0$ | nucleus | $1$ |
              | Electron | $-1$ | shells around the nucleus | almost $0$ |
          - type: callout
            tone: key
            md: >-
              Protons and neutrons are packed into the tiny, heavy **nucleus**. Electrons are
              far lighter and move around it.

      - id: negative-particle
        type: multiple_choice
        prompt: Which particle has a negative charge?
        choices: [proton, neutron, electron, nucleus]
        answer: 2
        explanation: Electrons are negative, protons are positive, and neutrons have no charge.

      - type: teach
        id: atomic-and-mass-number
        title: Atomic number and mass number
        blocks:
          - type: text
            md: |-
              - **Atomic number** = number of **protons**. It decides which element an atom is.
              - **Mass number** = protons + neutrons.
              - In a neutral atom, **electrons = protons**.

              Carbon-12 has atomic number $6$, so it has $6$ protons, $6$ electrons, and
              $12 - 6 = 6$ neutrons.
          - type: callout
            tone: tip
            md: 'Neutrons $=$ mass number $-$ atomic number.'

      - id: oxygen-neutrons
        type: math_input
        prompt: 'Oxygen has atomic number $8$ and mass number $16$. How many neutrons does it have?'
        answer: '8'
        placeholder: Enter a number
        explanation: '$16 - 8 = 8$ neutrons.'

      - type: teach
        id: bohr-diagrams
        title: Bohr–Rutherford diagrams
        blocks:
          - type: text
            md: >-
              Electrons fill **shells** from the inside out. For the first 20 elements, the
              shells hold up to $2$, then $8$, then $8$ electrons.
          - type: image
            src: science/bohr-sodium.svg
            alt: >-
              Bohr–Rutherford diagram of sodium: a nucleus with 11 protons and 12 neutrons,
              and electron shells holding 2, 8 and 1 electrons.
            aspect: 0.47
          - type: callout
            tone: key
            md: 'Sodium has $11$ electrons: $2$ in the first shell, $8$ in the second, $1$ in the third.'

      - id: magnesium-shells
        type: multiple_choice
        prompt: 'Magnesium has $12$ electrons. How are they arranged in shells?'
        choices: ['$2,\ 10$', '$2,\ 8,\ 2$', '$4,\ 4,\ 4$', '$8,\ 4$']
        answer: 1
        explanation: 'Fill the first shell ($2$), then the second ($8$), and the remaining $2$ go in the third.'

  - id: science-foundations-u1-t1-practice
    kind: practice
    topic: Inside the Atom
    title: 'Practice: Inside the Atom'
    description: Count particles and arrange electrons.
    xp: 10
    items:
      - id: protons-to-atomic-number
        type: math_input
        prompt: An atom has $17$ protons. What is its atomic number?
        answer: '17'
        placeholder: Enter a number
        explanation: The atomic number is the number of protons.

      - id: sodium-electrons
        type: math_input
        prompt: 'A neutral sodium atom has atomic number $11$. How many electrons does it have?'
        answer: '11'
        placeholder: Enter a number
        explanation: In a neutral atom, electrons equal protons.

      - id: aluminium-neutrons
        type: math_input
        prompt: 'Aluminium has atomic number $13$ and mass number $27$. How many neutrons?'
        answer: '14'
        placeholder: Enter a number
        explanation: '$27 - 13 = 14$'

      - id: where-is-nucleus
        type: multiple_choice
        prompt: Where are protons and neutrons found?
        choices: [in the outer shell, in the nucleus, spread evenly through the atom, outside the atom]
        answer: 1
        explanation: Both are packed together in the nucleus at the centre of the atom.

      - id: what-identifies-element
        type: multiple_choice
        prompt: What decides which element an atom is?
        choices: [its number of neutrons, its mass number, its number of protons, its number of shells]
        answer: 2
        explanation: Every atom with $6$ protons is carbon, every atom with $8$ is oxygen, and so on.

      - id: chlorine-valence
        type: multiple_choice
        prompt: 'Chlorine has $17$ electrons. How many are in its outer shell?'
        choices: ['$1$', '$8$', '$7$', '$17$']
        answer: 2
        explanation: 'Arrangement $2,\ 8,\ 7$: the outer shell holds $7$.'

  - id: science-foundations-u1-t1-destroyer
    kind: destroyer
    topic: Inside the Atom
    title: 'Destroyer: Inside the Atom'
    description: Ions, isotopes and working backwards.
    xp: 30
    items:
      - id: magnesium-ion
        type: math_input
        prompt: 'Magnesium (atomic number $12$) loses $2$ electrons to form $\text{Mg}^{2+}$. How many electrons does the ion have?'
        answer: '10'
        placeholder: Enter a number
        explanation: '$12 - 2 = 10$ electrons. The protons don''t change, so the ion has a $2+$ charge.'

      - id: isotopes-differ
        type: multiple_choice
        prompt: Carbon-12 and carbon-14 are isotopes. What is different about them?
        choices:
          - the number of protons
          - the number of neutrons
          - the number of electrons in a neutral atom
          - which element they are
        answer: 1
        explanation: 'Both have $6$ protons (so both are carbon). Carbon-14 has $8$ neutrons, carbon-12 has $6$.'

      - id: work-backwards-atomic-number
        type: math_input
        prompt: 'An atom has $20$ neutrons and mass number $39$. What is its atomic number?'
        answer: '19'
        placeholder: Enter a number
        explanation: '$39 - 20 = 19$ protons, so the atomic number is $19$ (potassium).'

      - id: same-electrons
        type: multiple_choice
        prompt: 'Which pair has the same number of electrons? (Na: $11$, Ne: $10$, Cl: $17$, Ar: $18$, Mg: $12$)'
        choices:
          - Na and Ne
          - Cl and Ar
          - $\text{Na}^{+}$ and Ne
          - Mg and $\text{Na}^{+}$
        answer: 2
        explanation: '$\text{Na}^{+}$ has lost one electron: $11 - 1 = 10$, the same as neon.'

  # =========================================================================================
  # Topic 2: The periodic table
  # =========================================================================================
  - id: science-foundations-u1-t2-learn
    kind: learn
    topic: The Periodic Table
    title: 'Learn: The Periodic Table'
    description: Periods, groups, metals and chemical families.
    xp: 10
    items:
      - type: teach
        id: rows-and-columns
        title: Rows and columns
        blocks:
          - type: text
            md: |-
              The periodic table arranges elements by **atomic number** (number of protons).

              - A **period** is a row. Elements in the same period have the same number of
                electron shells.
              - A **group** (or family) is a column. Elements in the same group have the same
                number of **valence electrons**, so they react in similar ways.
          - type: callout
            tone: key
            md: Same column, similar chemistry. That's the big idea behind the table.

      - id: same-group
        type: multiple_choice
        prompt: Which pair of elements would have the most similar chemical properties?
        choices: [Sodium and magnesium, Sodium and potassium, Sodium and chlorine, Sodium and neon]
        answer: 1
        explanation: Sodium and potassium are both in Group 1, so each has one valence electron.

      - type: teach
        id: metals-nonmetals
        title: Metals, non-metals and metalloids
        blocks:
          - type: text
            md: |-
              A staircase line runs down the right side of the table.

              - **Metals** (left of the line): shiny, conduct heat and electricity, malleable.
                Most elements are metals.
              - **Non-metals** (right of the line): dull, brittle as solids, poor conductors.
                Many are gases.
              - **Metalloids** (along the line, like silicon and boron): a mix of both.
          - type: callout
            tone: warning
            title: The odd one out
            md: Hydrogen sits in Group 1 but is a non-metal gas.

      - id: classify-sulfur
        type: multiple_choice
        prompt: 'Sulfur is a yellow, brittle solid that does not conduct electricity. It is a...'
        choices: [metal, metalloid, non-metal, noble gas]
        answer: 2
        explanation: Dull, brittle and a poor conductor are all properties of non-metals.

      - type: teach
        id: chemical-families
        title: Four families to know
        blocks:
          - type: text
            md: |-
              - **Group 1, alkali metals** (Li, Na, K): very reactive, react with water.
              - **Group 2, alkaline earth metals** (Be, Mg, Ca): reactive, less than Group 1.
              - **Group 17, halogens** (F, Cl, Br): very reactive non-metals.
              - **Group 18, noble gases** (He, Ne, Ar): full outer shells, so almost
                completely unreactive.

      - id: noble-gas
        type: multiple_choice
        prompt: Why is argon used inside light bulbs instead of air?
        choices:
          - It is very reactive and burns brightly
          - It is a noble gas, so it won't react with the hot filament
          - It is a metal and conducts electricity
          - It is a halogen and glows
        answer: 1
        explanation: Argon's full outer shell makes it unreactive, so the filament doesn't burn up.

  - id: science-foundations-u1-t2-practice
    kind: practice
    topic: The Periodic Table
    title: 'Practice: The Periodic Table'
    description: Read the table and name the families.
    xp: 10
    items:
      - id: row-name
        type: multiple_choice
        prompt: What is a horizontal row of the periodic table called?
        choices: [A group, A family, A period, A shell]
        answer: 2
        explanation: Rows are periods; columns are groups (families).

      - id: halogen-pick
        type: multiple_choice
        prompt: Which element is a halogen?
        choices: [Chlorine, Calcium, Carbon, Copper]
        answer: 0
        explanation: Chlorine is in Group 17, the halogens.

      - id: valence-group-two
        type: math_input
        prompt: How many valence electrons does magnesium (Group 2) have?
        answer: '2'
        placeholder: Enter a number
        explanation: Group 2 elements have 2 valence electrons.

      - id: metal-property
        type: multiple_choice
        prompt: Which property describes most metals?
        choices: [Brittle, Good conductor of electricity, Dull, Usually a gas]
        answer: 1
        explanation: Metals conduct heat and electricity well.

      - id: most-reactive-family
        type: multiple_choice
        prompt: Which family of metals reacts most violently with water?
        choices: [Noble gases, Halogens, Alkaline earth metals, Alkali metals]
        answer: 3
        explanation: Group 1 alkali metals lose their single valence electron very easily.

      - id: shells-period-three
        type: math_input
        prompt: How many electron shells does an element in Period 3 have?
        answer: '3'
        placeholder: Enter a number
        explanation: The period number equals the number of occupied electron shells.

  - id: science-foundations-u1-t2-destroyer
    kind: destroyer
    topic: The Periodic Table
    title: 'Destroyer: The Periodic Table'
    description: Use the table's patterns to predict.
    xp: 30
    items:
      - id: mystery-element
        type: multiple_choice
        prompt: >-
          A mystery element is a shiny solid, conducts electricity and reacts slowly with water.
          It has 2 valence electrons and 4 electron shells. What is it?
        choices: [Potassium, Calcium, Magnesium, Bromine]
        answer: 1
        explanation: 2 valence electrons means Group 2, and 4 shells means Period 4. That's calcium.

      - id: predict-reactivity
        type: multiple_choice
        prompt: >-
          Lithium, sodium and potassium all react with water. Reactivity increases down the group.
          Which would react even more violently than potassium?
        choices: [Magnesium, Hydrogen, Rubidium, Neon]
        answer: 2
        explanation: Rubidium is below potassium in Group 1, so it is even more reactive.

      - id: valence-from-atomic-number
        type: math_input
        prompt: An element has atomic number 15. How many valence electrons does it have?
        answer: '5'
        placeholder: Enter a number
        hint: 'Fill the shells 2, 8, then the rest.'
        explanation: 'Phosphorus: 15 electrons arranged 2, 8, 5, so 5 valence electrons.'

      - id: same-period-pair
        type: multiple_choice
        prompt: Which statement about sodium (Na) and chlorine (Cl) is true?
        choices:
          - They are in the same group, so they react alike
          - They are in the same period, so both have 3 electron shells
          - Both are metals
          - Both are noble gases
        answer: 1
        explanation: Na and Cl are both in Period 3. They are in very different groups, a metal and a non-metal.
