# SBI3U — Strand B: Diversity of Living Things

id: sbi3u-u1
title: Diversity of Living Things
description: >-
  How biologists organize millions of species: taxonomy, scientific names, domains and
  kingdoms.

lessons:
  - id: sbi3u-u1-t1-learn
    kind: learn
    topic: Classifying Life
    title: 'Learn: Classifying Life'
    description: Taxonomic levels, binomial nomenclature and the three domains.
    xp: 10
    items:
      - type: teach
        id: taxonomic-levels
        title: The levels of classification
        blocks:
          - type: text
            md: |-
              **Taxonomy** sorts living things into nested groups, from broadest to most
              specific:

              **Domain → Kingdom → Phylum → Class → Order → Family → Genus → Species**
          - type: callout
            tone: tip
            md: '**D**ear **K**ing **P**hilip **C**ame **O**ver **F**or **G**ood **S**oup.'
          - type: text
            md: Organisms in the same species share every level above it. The further down two organisms match, the more closely related they are.

      - id: most-specific-level
        type: multiple_choice
        prompt: Which level of classification is the most specific?
        choices: [kingdom, domain, family, species]
        answer: 3
        explanation: Species is the smallest group. Members can breed and produce fertile offspring.

      - type: teach
        id: binomial-nomenclature
        title: Scientific names
        blocks:
          - type: text
            md: |-
              Every species gets a two-part **scientific name** (binomial nomenclature):
              *Genus species*.

              - The genus is capitalized; the species name is lowercase.
              - Both are written in *italics* (or underlined by hand).

              Humans are *Homo sapiens*. House cats are *Felis catus*.
          - type: callout
            tone: key
            md: Scientific names are the same in every language, so scientists anywhere know exactly which organism is meant.

      - id: correct-format
        type: multiple_choice
        prompt: Which scientific name is written correctly?
        choices: ['*felis catus*', '*Felis Catus*', '*Felis catus*', 'Felis Catus']
        answer: 2
        explanation: Genus capitalized, species lowercase, both italicized.

      - type: teach
        id: domains-and-kingdoms
        title: Three domains
        blocks:
          - type: text
            md: |-
              | Domain | Cell type | Examples |
              |---|---|---|
              | Bacteria | prokaryotic (no nucleus) | *E. coli*, *Streptococcus* |
              | Archaea | prokaryotic (no nucleus) | microbes in hot springs and salt lakes |
              | Eukarya | eukaryotic (nucleus) | protists, fungi, plants, animals |

              Eukarya is divided into four kingdoms: **Protists, Fungi, Plants and Animals**.

      - id: mushroom-kingdom
        type: multiple_choice
        prompt: Mushrooms belong to which kingdom?
        choices: [Plants, Fungi, Protists, Bacteria]
        answer: 1
        explanation: Mushrooms are fungi. They don't photosynthesize; they absorb nutrients from their surroundings.

  - id: sbi3u-u1-t1-practice
    kind: practice
    topic: Classifying Life
    title: 'Practice: Classifying Life'
    description: Levels, names and kingdoms.
    xp: 10
    items:
      - id: level-after-order
        type: multiple_choice
        prompt: Which level comes directly after order?
        choices: [class, genus, family, phylum]
        answer: 2
        explanation: '... Class → Order → **Family** → Genus → Species.'

      - id: no-nucleus-domain
        type: multiple_choice
        prompt: Which domain is made of eukaryotic organisms?
        choices: [Bacteria, Archaea, Eukarya]
        answer: 2
        explanation: Eukaryotes have a nucleus. Bacteria and Archaea are both prokaryotes.

      - id: genus-implies-family
        type: multiple_choice
        prompt: Two organisms are in the same genus. Which other level must they share?
        choices: [species, family, none of the others, only domain]
        answer: 1
        explanation: Groups are nested, so sharing a genus means sharing every level above it, including family.

      - id: genus-of-wolf
        type: multiple_choice
        prompt: 'The grey wolf is *Canis lupus*. What is its genus?'
        choices: ['*lupus*', '*Canis*', 'Canidae', 'Carnivora']
        answer: 1
        explanation: The first word of a scientific name is the genus.

      - id: archaea-habitat
        type: multiple_choice
        prompt: Many archaea are known for living in...
        choices:
          - extreme environments like hot springs
          - only inside animals
          - only in fresh water lakes
          - only on plant leaves
        answer: 0
        explanation: Many archaea thrive in extreme heat, salt or acidity, though some live in ordinary places too.

      - id: plant-features
        type: multiple_choice
        prompt: Which feature belongs to the plant kingdom?
        choices:
          - cell walls made of chitin
          - no cell walls
          - photosynthesis and cell walls made of cellulose
          - prokaryotic cells
        answer: 2
        explanation: Plants make their own food by photosynthesis, and their cell walls are made of cellulose. Fungi use chitin.

  - id: sbi3u-u1-t1-destroyer
    kind: destroyer
    topic: Classifying Life
    title: 'Destroyer: Classifying Life'
    description: Reasoning with the hierarchy and dichotomous keys.
    xp: 30
    items:
      - id: shared-order
        type: multiple_choice
        prompt: Two organisms belong to the same order. Which statement must be true?
        choices:
          - They are the same species
          - They belong to the same family
          - They belong to the same class
          - They belong to different kingdoms
        answer: 2
        explanation: Order sits inside class, so organisms in one order share the same class (and every level above).

      - id: dichotomous-key
        type: multiple_choice
        prompt: |-
          Use this dichotomous key:

          1a. Has a backbone → go to 2
          1b. No backbone → **Insect**
          2a. Has feathers → **Bird**
          2b. No feathers → go to 3
          3a. Has fur → **Mammal**
          3b. No fur → **Reptile**

          An animal has a backbone, no feathers and no fur. What is it?
        choices: [Insect, Bird, Mammal, Reptile]
        answer: 3
        explanation: 1a (backbone) → 2b (no feathers) → 3b (no fur) → Reptile.

      - id: bacteria-vs-archaea
        type: multiple_choice
        prompt: Bacteria and Archaea are both prokaryotes. Why are they placed in separate domains?
        choices:
          - Archaea have a nucleus
          - They differ in their chemistry, such as cell membranes and cell walls
          - Bacteria are multicellular
          - Archaea can photosynthesize and bacteria cannot
        answer: 1
        explanation: Both lack a nucleus, but their cell membranes, cell walls and genetic machinery differ enough to make separate domains.

      - id: why-scientific-names
        type: multiple_choice
        prompt: Why do scientists use scientific names instead of common names?
        choices:
          - Scientific names are shorter
          - One species can have many common names, but has only one scientific name
          - Common names are illegal in science
          - Scientific names describe what the organism eats
        answer: 1
        explanation: >-
          For example, a "cougar", "puma" and "mountain lion" are all *Puma concolor*. A single
          scientific name avoids that confusion.

  # =========================================================================================
  # Topic 2: Bacteria and viruses
  # =========================================================================================
  - id: sbi3u-u1-t2-learn
    kind: learn
    topic: Bacteria and Viruses
    title: 'Learn: Bacteria and Viruses'
    description: Prokaryotic cells, how bacteria grow, and why viruses aren't alive.
    xp: 10
    items:
      - type: teach
        id: bacterial-cells
        title: Bacteria are prokaryotes
        blocks:
          - type: text
            md: |-
              Bacteria are single-celled **prokaryotes**: no nucleus and no membrane-bound
              organelles. Their DNA floats in a region called the **nucleoid**, often with
              small extra loops of DNA called **plasmids**.

              They are classified by shape: **cocci** (spheres), **bacilli** (rods) and
              **spirilla** (spirals).
          - type: callout
            tone: key
            md: Most bacteria are harmless or helpful, in digestion, in soil and in making foods like yogurt.

      - id: rod-shaped
        type: multiple_choice
        prompt: What is a rod-shaped bacterium called?
        choices: [Coccus, Spirillum, Bacillus, Virion]
        answer: 2
        explanation: Bacilli are rods, cocci are spheres and spirilla are spirals.

      - type: teach
        id: binary-fission
        title: Binary fission
        blocks:
          - type: text
            md: |-
              Bacteria reproduce asexually by **binary fission**: copy the DNA, then split in two.
              In good conditions this can happen every $20$ minutes, so the population
              **doubles** each generation.
          - type: graph
            x: [0, 6.5]
            y: [0, 70]
            x_label: generations
            y_label: bacteria
            curves:
              - { expr: 2^x, domain: [0, 6], label: 'N = 2ⁿ' }
            points:
              - { at: [6, 64], label: '64' }
            caption: One cell becomes 64 after six generations, two hours at 20 minutes each.

      - id: doubling-count
        type: math_input
        prompt: A single bacterium divides every 20 minutes. How many bacteria are there after 1 hour?
        answer: '8'
        placeholder: Enter a number
        explanation: 'One hour is 3 generations: $2^3 = 8$.'

      - type: teach
        id: viruses
        title: Viruses
        blocks:
          - type: text
            md: |-
              A virus is genetic material (DNA or RNA) inside a protein coat called a **capsid**.
              It has no cells, no metabolism, and can only reproduce **inside a host cell**,
              so most biologists don't classify viruses as living.

              In the **lytic cycle**, a virus takes over the cell, makes copies of itself, and
              bursts the cell open. In the **lysogenic cycle**, its DNA hides in the host's
              DNA and is copied every time the cell divides, until it switches to lytic.
          - type: callout
            tone: warning
            title: Antibiotics vs viruses
            md: Antibiotics target bacterial structures. They do nothing against viruses.

      - id: virus-not-alive
        type: multiple_choice
        prompt: Why are viruses usually not considered living?
        choices:
          - They are too small to see
          - They contain no genetic material
          - They cannot reproduce or carry out metabolism on their own
          - They only infect animals
        answer: 2
        explanation: Viruses need a host cell's machinery to do anything at all.

  - id: sbi3u-u1-t2-practice
    kind: practice
    topic: Bacteria and Viruses
    title: 'Practice: Bacteria and Viruses'
    description: Structures, shapes and life cycles.
    xp: 10
    items:
      - id: prokaryote-missing
        type: multiple_choice
        prompt: Which structure do bacteria NOT have?
        choices: [Cell membrane, Ribosomes, Nucleus, DNA]
        answer: 2
        explanation: Prokaryotes have no nucleus; their DNA sits in the nucleoid.

      - id: capsid-name
        type: multiple_choice
        prompt: What is the protein coat of a virus called?
        choices: [Capsid, Plasmid, Cell wall, Nucleoid]
        answer: 0
        explanation: The capsid protects the virus's genetic material.

      - id: sphere-shape
        type: multiple_choice
        prompt: Streptococcus bacteria are spheres arranged in chains. What shape are they?
        choices: [Bacilli, Spirilla, Cocci, Rods]
        answer: 2
        explanation: '"Cocci" means spheres, and "strepto-" means chains.'

      - id: generations-to-16
        type: math_input
        prompt: Starting from one bacterium, how many generations of binary fission make 16 bacteria?
        answer: '4'
        placeholder: Enter a number
        explanation: '$2^4 = 16$'

      - id: lytic-ending
        type: multiple_choice
        prompt: How does the lytic cycle end?
        choices:
          - The viral DNA joins the host DNA
          - The host cell bursts and releases new viruses
          - The host cell divides normally
          - The virus is destroyed by antibiotics
        answer: 1
        explanation: Lysis means bursting; the new viruses go on to infect more cells.

      - id: antibiotic-use
        type: multiple_choice
        prompt: Antibiotics would help treat which illness?
        choices: [The flu, The common cold, Strep throat, Chickenpox]
        answer: 2
        explanation: Strep throat is caused by bacteria; the others are viral.

  - id: sbi3u-u1-t2-destroyer
    kind: destroyer
    topic: Bacteria and Viruses
    title: 'Destroyer: Bacteria and Viruses'
    description: Growth calculations and resistance.
    xp: 30
    items:
      - id: three-hour-growth
        type: math_input
        prompt: >-
          A sample starts with 50 bacteria that divide every 30 minutes. How many are there after
          3 hours, assuming none die?
        answer: '3200'
        placeholder: Enter a number
        explanation: '3 hours is 6 generations: $50 \times 2^6 = 50 \times 64 = 3200$.'

      - id: resistance-cause
        type: multiple_choice
        prompt: How does antibiotic resistance spread through a bacterial population?
        choices:
          - Bacteria learn to avoid the antibiotic
          - The antibiotic causes every bacterium to mutate
          - Resistant bacteria survive and reproduce, so their genes become more common
          - Viruses carry the antibiotic away
        answer: 2
        explanation: This is natural selection. Plasmids can also pass resistance genes between bacteria.

      - id: lysogenic-hidden
        type: multiple_choice
        prompt: >-
          A person infected with a herpes virus has no symptoms for years, then gets a cold sore.
          Which best explains this?
        choices:
          - The virus was in the lytic cycle the whole time
          - The virus was in the lysogenic cycle, then switched to the lytic cycle
          - The virus died and a new one infected them
          - Bacteria activated the virus
        answer: 1
        explanation: The viral DNA stayed hidden in host cells, then entered the lytic cycle and caused symptoms.

      - id: doubling-time
        type: math_input
        prompt: >-
          A culture grows from 100 to 800 bacteria in 90 minutes. What is the doubling time,
          in minutes?
        answer: '30'
        placeholder: minutes
        explanation: '$800 / 100 = 8 = 2^3$, so 3 doublings in 90 minutes: one every 30 minutes.'
