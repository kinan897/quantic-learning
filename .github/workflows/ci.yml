name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check app tests migrations

      - name: Test
        # Covers the math grader, every question's answer key, auth, progress and
        # migrations vs. models.
        run: pytest -q

  mobile:
    name: App (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # Expo's generated route types (.expo/types) only exist after `expo start`, so CI
        # checks route links loosely. Everything else is fully type-checked.
        run: npm run typecheck

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Build web
        # A full production bundle: catches broken imports and missing files that the
        # typechecker can't see.
        run: npx expo export --platform web --output-dir dist
        env:
          CI: "1"
